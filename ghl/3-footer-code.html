<script>
(function () {
  function start() {
    if (window.__jcStarted || !document.querySelector('.jc')) return false;
    window.__jcStarted = true;
    // Fade-up entrance as blocks scroll into view, staggered within each group.
    // Skipped entirely for reduced motion or old browsers, so content is always visible without it.
    (() => {
      if (!('IntersectionObserver' in window) || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      const groups = ['.intro > *', '.video', '.cta', 'section > .wrap > .label', 'section > .wrap > h2',

      }), { rootMargin: '0px 0px -8% 0px' });
      document.querySelectorAll(groups.join(',')).forEach(el => {
        const i = [...el.parentElement.children].indexOf(el);
        el.style.setProperty('--d', Math.min(i, 6) * 70 + 'ms');
        el.classList.add('reveal');
        io.observe(el);
      });
    })();

    // Whop checkout embedded in the price section (74 €): Whop's EmbeddedCheckout component (whop-checkout/), bundled in
    // whop-checkout.js and loaded only when the visitor nears the prices.
    const WHOP_PLAN_ID_CURSO = 'plan_IJNoDfl4ZUsMy';
    const WHOP_CHECKOUT_SCRIPT = 'https://davidcohencontent-create.github.io/coding-test/funnel/whop-checkout.js?v=2';
    // After a completed checkout (paid, or free with a promo code or a free plan) the buyer goes straight into the course in Whop.
    // Same after an off-site payment step (Klarna, bank transfer…): Whop sends the buyer back to this URL.
    const COURSE_URL = 'https://whop.com/judithcalzadaduaigues-1bce/confianza-sin-permiso-66/';
    (() => {
      const box = document.getElementById('whop-checkout');
      if (!box || window.__jcWhopLoaded) return;
      const mount = () => window.JCWhopCheckout.mount(box, {
        plan: WHOP_PLAN_ID_CURSO,
        returnUrl: COURSE_URL,
        // A link with ?promo=CODE opens the checkout with that Whop promo code already applied (buyers can also type one in)
        promoCode: new URLSearchParams(location.search).get('promo') || undefined,
        // Paid or free: the order stands, so go to the course
        onComplete: r => { if (r && r.result !== 'waitlist_entry') location.href = COURSE_URL; },
      });
      const load = () => {
        if (window.__jcWhopLoaded) return;
        window.__jcWhopLoaded = true;
        const s = document.createElement('script');
        s.src = WHOP_CHECKOUT_SCRIPT; s.async = true; s.onload = mount;
        document.head.appendChild(s);
      };
      if (!('IntersectionObserver' in window)) return load();
      const io = new IntersectionObserver(e => { if (e.some(x => x.isIntersecting)) { io.disconnect(); load(); } }, { rootMargin: '900px 0px' });
      io.observe(box);
    })();

    // Sales page behaviour: method steps unlock as you scroll, and the Day 1 trailer's timed preview.

    // Method: each step lights up when it reaches the middle of the screen and stays unlocked.
    // Without JS, or with reduced motion, every step is simply shown.
    (() => {
      const steps = [...document.querySelectorAll('.unlock li')];
      const count = document.querySelector('[data-step]');
      const bar = document.querySelector('.progress .bar i');
      if (!steps.length || !('IntersectionObserver' in window) || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      document.documentElement.classList.add('js-unlock');
      const show = i => {
        steps.forEach((s, j) => { if (j <= i) s.classList.add('on'); });
        count.textContent = String(i + 1).padStart(2, '0');
        bar.style.setProperty('--p', (i + 1) / steps.length);
      };
      steps[0].classList.add('on');
      const io = new IntersectionObserver(entries => entries.forEach(e => {
        if (e.isIntersecting) show(steps.indexOf(e.target));
      }), { rootMargin: '-45% 0px -45% 0px' });
      steps.forEach(s => io.observe(s));
    })();

    // Trailer: plays for data-preview seconds, then pauses and shows the paywall.
    // Works with a Vimeo embed (via Vimeo's player API), a <video>, or the placeholder (the play button runs the countdown).
    (() => {
      const box = document.querySelector('.trailer[data-preview]');
      if (!box) return;
      const limit = Number(box.dataset.preview) || 60;
      const iframe = box.querySelector('iframe');
      const video = box.querySelector('video');
      const play = box.querySelector('.play');
      const timer = box.querySelector('.timer');
      const paywall = box.querySelector('.paywall');
      const fmt = s => { const t = Math.ceil(s); return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0'); };
      const render = left => { timer.textContent = 'Vista previa · ' + fmt(Math.max(0, left)); };
      const locked = () => !paywall.hidden;
      let pause = () => {};
      const lock = () => { pause(); if (play) play.hidden = true; paywall.hidden = false; render(0); };

      if (iframe) {
        if (!window.Vimeo) return; // player script blocked: the video still plays, just without the preview limit
        const player = new Vimeo.Player(iframe);
        pause = () => player.pause();
        player.on('timeupdate', d => { render(limit - d.seconds); if (d.seconds >= limit && !locked()) lock(); });
        player.on('seeked', d => { if (d.seconds > limit) player.setCurrentTime(limit); });
        player.on('play', () => { if (locked()) player.pause(); });
        player.on('ended', () => { if (!locked()) lock(); }); // the last timeupdate can land just short of the limit
      } else if (video) {
        pause = () => video.pause();
        video.addEventListener('timeupdate', () => { render(limit - video.currentTime); if (video.currentTime >= limit) lock(); });
        video.addEventListener('seeking', () => { if (video.currentTime > limit) video.currentTime = limit; });
        video.addEventListener('pause', () => { if (!locked() && play) play.hidden = false; });
        video.addEventListener('ended', () => { if (!locked()) lock(); });
      }
      let elapsed = 0, tick = null;
      play?.addEventListener('click', () => {
        play.hidden = true;
        if (video) { video.play(); return; }
        tick = setInterval(() => { elapsed++; render(limit - elapsed); if (elapsed >= limit) { clearInterval(tick); lock(); } }, 1000);
      });
      // Closing Day 1 pauses the preview
      box.closest('details')?.addEventListener('toggle', e => {
        if (e.target.open || locked()) return;
        pause();
        if (tick) { clearInterval(tick); tick = null; play.hidden = false; }
      });
    })();

    // Reviews slider: arrows and dots move one testimonial at a time; swipe and keyboard scroll natively.
    (() => {
      const track = document.querySelector('.slider .track');
      if (!track) return;
      const slides = [...track.children];
      const prev = document.querySelector('.slider .prev');
      const next = document.querySelector('.slider .next');
      const dots = document.querySelector('.dots');
      const go = i => track.scrollTo({ left: i * track.clientWidth });
      const current = () => Math.round(track.scrollLeft / track.clientWidth);
      slides.forEach((_, i) => {
        const b = document.createElement('button');
        b.type = 'button'; b.setAttribute('aria-label', 'Testimonio ' + (i + 1));

      const update = () => {
        const i = current();
        [...dots.children].forEach((d, j) => d.classList.toggle('on', j === i));
        prev.disabled = i === 0;
        next.disabled = i === slides.length - 1;
      };
      prev.addEventListener('click', () => go(current() - 1));
      next.addEventListener('click', () => go(current() + 1));
      track.addEventListener('scroll', () => requestAnimationFrame(update), { passive: true });
      update();
    })();

        if (!caught) { ox = e.clientX - r.left; oy = e.clientY - r.top; }
        el.classList.add('grab');
        voiceOn = true; voice.squeak();
        try { svgEl.setPointerCapture(e.pointerId); } catch (_) {}
      });
      svgEl.addEventListener('pointermove', e => {
        if (!dragging) return;
        samples.push({ t: performance.now(), x: e.clientX, y: e.clientY }); if (samples.length > 12) samples.shift();
        if (!moved && Math.hypot(e.clientX - sx, e.clientY - sy) < 5) return;
        if (!moved) {                                   // lift it off its edge into free movement
          moved = true;
          const r = el.getBoundingClientRect();
          el.classList.remove('on', 'walk', 'arrive', 'up');
          el.classList.add('drag');
          el.dataset.side = 'free';
          el.style.left = r.left + 'px'; el.style.top = r.top + 'px';
          ox = Math.min(ox, r.width); oy = Math.min(oy, r.height);
        }
        const n = size();
        const left = Math.max(-n * .3, Math.min(innerWidth - n * .7, e.clientX - ox));
        const top = Math.max(0, Math.min(innerHeight - n * .7, e.clientY - oy));
        el.style.left = left + 'px'; el.style.top = top + 'px';
        el.classList.toggle('yell-below', top < 70);
        const vx = e.clientX - px; px = e.clientX;
        el.style.transform = `rotate(${Math.max(-28, Math.min(28, vx * 1.8)).toFixed(1)}deg)`;
        el.classList.add('scream'); screamSound();
        clearTimeout(quietT); quietT = setTimeout(() => el.classList.remove('scream'), 260);   // stops when you stop
      });
      function drop() {
        if (!dragging) return;
        dragging = false;
        clearTimeout(quietT);
        el.classList.remove('grab', 'scream');
        if (!moved) return poke();
        // Throw: carry on with the speed of the last ~90 ms of the drag
        const now = performance.now(), recent = samples.filter(q => now - q.t < 90);
        let vx = 0, vy = 0;
        if (recent.length > 1) {
          const a = recent[0], z = recent[recent.length - 1], dt = Math.max(16, z.t - a.t) / 1000;
          vx = (z.x - a.x) / dt; vy = (z.y - a.y) / dt;
        }
        const cap = 3200, sp = Math.hypot(vx, vy);
        if (sp > cap) { vx *= cap / sp; vy *= cap / sp; }
        fly(vx, vy);
      }

      // Gravity: it flies (laughing), spins, bounces off the walls, ceiling and floor, then settles on the bottom edge.
      // Hitting a wall or the ceiling makes it glow red for a moment and pops out little copies of it.
      let flyRaf = 0, flying = false, hurtT = 0;
      const FUN = ['¡Wiiiii!', '¡Yupiii!', '¡Jajaja!', '¡Más alto!', '¡Weee!'];
      function fly(vx, vy) {
        const n = size(), r = el.getBoundingClientRect();
        let x = parseFloat(el.style.left) || r.left, y = parseFloat(el.style.top) || r.top, ang = 0, spin = vx * .25, last = performance.now(), bumpT = 0;
        const G = 2600, floor = () => innerHeight - n * .72, right = () => innerWidth - n;
        flying = true;
        el.classList.remove('scream', 'grab');
        el.classList.add('drag', 'joy');
        yell.textContent = pick(FUN);
        if (Math.hypot(vx, vy) > 500) voice.wee();
        cancelAnimationFrame(flyRaf);
        const step = t => {
          const dt = Math.min(.033, (t - last) / 1000); last = t;
          vy += G * dt; x += vx * dt; y += vy * dt;
          let wall = 0, wx = 0, wy = 0, dir = 0;
          if (x < 0) { x = 0; wall = Math.abs(vx); vx = -vx * .62; spin = -spin * .7; wx = 0; wy = y + n / 2; dir = 1; }
          if (x > right()) { x = right(); wall = Math.abs(vx); vx = -vx * .62; spin = -spin * .7; wx = innerWidth; wy = y + n / 2; dir = -1; }
          if (y < 0) { y = 0; wall = Math.max(wall, Math.abs(vy)); vy = -vy * .5; wx = x + n / 2; wy = 0; dir = dir || (vx >= 0 ? 1 : -1); }
          const onFloor = y >= floor();
          if (onFloor) {
            y = floor();
            if (vy > 0) { if (vy > 650 && t - bumpT > 180) { bumpT = t; squash(); voice.oof(); } vy = -vy * .48; }
            vx *= Math.pow(.18, dt);                         // floor friction
            spin = vx * .25; ang *= Math.pow(.02, dt);       // roll, then sit upright
          }
          if (wall > 450 && t - bumpT > 160) {               // a wall or the ceiling: red glow, boing, minis pop out
            bumpT = t; squash(); voice.boing();
            el.classList.add('hurt'); clearTimeout(hurtT); hurtT = setTimeout(() => el.classList.remove('hurt'), 420);
            const k = wall > 1400 ? 3 : wall > 800 ? 2 : 1;
            for (let i = 0; i < k; i++) spawnMini(wx, wy, dir, wall);
          }
          ang += spin * dt;
          el.classList.toggle('fast', Math.hypot(vx, vy) > 550);
          el.classList.toggle('yell-below', y < 70);
          el.style.left = x + 'px'; el.style.top = y + 'px';
          el.style.transform = `rotate(${ang.toFixed(1)}deg)`;
          if (onFloor && Math.abs(vy) < 140 && Math.abs(vx) < 45 && Math.abs(ang) < 4) return settle();
          flyRaf = requestAnimationFrame(step);
        };
        flyRaf = requestAnimationFrame(step);
      }
      function squash() { el.classList.remove('land'); void el.offsetWidth; el.classList.add('land'); }

      // Minis: little copies of the mascot that tumble out of a wall hit, bounce around for a few seconds, then shrink away
      const minis = []; let miniRaf = 0;
      function spawnMini(x, y, dir, power) {
        if (minis.length >= 12) return;
        const m = document.createElement('div');
        m.className = 'jm jm-mini joy'; m.setAttribute('aria-hidden', 'true');
        m.innerHTML = svgEl.outerHTML;
        document.body.appendChild(m);
        const sp = Math.min(1, power / 1600);
        minis.push({ m, x: x - 22 + dir * 10, y: Math.max(0, y - 22), vx: dir * (220 + Math.random() * 520) * (.6 + sp),
          vy: -(380 + Math.random() * 620) * (.6 + sp), ang: 0, spin: (Math.random() - .5) * 900, born: performance.now(),
          life: 2600 + Math.random() * 1800, last: performance.now(), s: .85 + Math.random() * .3 });
        voice.peep();
        if (!miniRaf) miniRaf = requestAnimationFrame(stepMinis);
      }
      function stepMinis(t) {
        const G = 2200, W = innerWidth - 44, F = innerHeight - 44;
        for (let i = minis.length - 1; i >= 0; i--) {
          const q = minis[i], dt = Math.min(.033, (t - q.last) / 1000); q.last = t;
          q.vy += G * dt; q.x += q.vx * dt; q.y += q.vy * dt;
          if (q.x < 0) { q.x = 0; q.vx = -q.vx * .7; }
          if (q.x > W) { q.x = W; q.vx = -q.vx * .7; }
          if (q.y < 0) { q.y = 0; q.vy = -q.vy * .6; }
          if (q.y > F) { q.y = F; q.vy = q.vy > 120 ? -q.vy * .55 : 0; q.vx *= Math.pow(.25, dt); q.spin = q.vx * .6; q.ang *= Math.pow(.05, dt); }
          q.ang += q.spin * dt;
          const age = t - q.born, out = Math.max(0, (age - q.life) / 350);
          const sc = q.s * (1 - out) * Math.min(1, age / 120);
          q.m.style.transform = `translate3d(${q.x.toFixed(1)}px,${q.y.toFixed(1)}px,0) rotate(${q.ang.toFixed(1)}deg) scale(${sc.toFixed(3)})`;
          if (out >= 1) { q.m.remove(); minis.splice(i, 1); }
        }
        miniRaf = minis.length ? requestAnimationFrame(stepMinis) : 0;
      }
      function stopFlying() { if (!flying) return; flying = false; cancelAnimationFrame(flyRaf); el.classList.remove('joy', 'fast'); yell.textContent = '¡AAAAAH!'; }
      function settle() {
        stopFlying();
        el.classList.remove('drag', 'scream', 'fall', 'joy', 'fast');
        el.style.transform = '';
        el.style.transition = 'none';
        el.dataset.side = 'bottom'; el.style.top = '';
        el.classList.add('on');
        void el.offsetWidth; el.style.transition = '';
        el.classList.remove('land'); void el.offsetWidth;
        el.classList.add('land'); later(() => el.classList.remove('land'), 500);
        voice.giggle();
        later(() => talk(pick(['¡Otra vez!', '¡Qué divertido!', '¡Wiii, otra!', '¡Más, más!', '¡Jajaja!'])), 500);
        later(() => walk('bottom'), 2800);
        later(leave, 5400);
      }
      svgEl.addEventListener('pointerup', drop);
      svgEl.addEventListener('pointercancel', drop);
      svgEl.addEventListener('lostpointercapture', drop);
      el.addEventListener('mouseenter', () => { hovering = true; });
      el.addEventListener('mouseleave', () => { hovering = false; });

      // Eyes and face follow the cursor
      const face = el.querySelector('.jm-face');
      let mx = 0, my = 0, raf = 0;
      addEventListener('mousemove', e => {
        mx = e.clientX; my = e.clientY;
        if (raf || !visible) return;
        raf = requestAnimationFrame(() => {
          raf = 0;
          const r = el.getBoundingClientRect();
          let dx = mx - (r.left + r.width / 2), dy = my - (r.top + r.height / 2);
          const side = el.dataset.side; // the svg is turned on the sides, so turn the direction with it
          if (side === 'left') [dx, dy] = [dy, -dx];
          if (side === 'right') [dx, dy] = [-dy, dx];
          const d = Math.hypot(dx, dy) || 1, k = Math.min(1, d / 300);
          face.style.transform = `translate(${(dx / d * 4 * k).toFixed(2)}px,${(dy / d * 3 * k).toFixed(2)}px)`;
        });
      }, { passive: true });

      later(show, 2500);
    })();
    return true;
  }
  // GHL renders the page in stages: try on load, then retry briefly until the sections exist.
  var tries = 0;
  function tick() { if (!start() && !window.__jcStarted && tries++ < 40) setTimeout(tick, 250); }
  if (document.readyState === 'complete') setTimeout(tick, 300);
  else window.addEventListener('load', function () { setTimeout(tick, 300); });
})();
</script>
