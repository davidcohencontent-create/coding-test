<!-- Curso de Confianza: paste into GHL page Settings → Tracking Code → Footer -->
<script src="https://player.vimeo.com/api/player.js"></script>
<script>
(function () {
  function start() {
    if (window.__jcStarted || !document.querySelector('.jc')) return false;
    window.__jcStarted = true;
    // Fade-up entrance as blocks scroll into view, staggered within each group.
    // Skipped entirely for reduced motion or old browsers, so content is always visible without it.
    (() => {
      if (!('IntersectionObserver' in window) || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      const groups = ['.intro > *', '.video', '.cta', 'section > .wrap > .label', 'section > .wrap > h2',
        '.method-head > *', '.about > *', '.gallery > *', '.days > *', '.cols > *', '.plans > *',
        '.faq > *', '.checks > *', '.tools > *', '.tiers > *', '.slider', '.logos', '.compare', '.coda', '.final .wrap > *', '.checkout > *', '.offer .wrap > *', '.next > *'];
      const io = new IntersectionObserver(entries => entries.forEach(e => {
        if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); }
      }), { rootMargin: '0px 0px -8% 0px' });
      document.querySelectorAll(groups.join(',')).forEach(el => {
        const i = [...el.parentElement.children].indexOf(el);
        el.style.setProperty('--d', Math.min(i, 6) * 70 + 'ms');
        el.classList.add('reveal');
        io.observe(el);
      });
    })();

    // Whop checkout embedded in the price section (74 €): Whop's EmbeddedCheckout component (whop-checkout/), bundled in
    // whop-checkout.js and loaded only when the visitor nears the prices.
    const WHOP_PLAN_ID_CURSO = 'plan_IJNoDfl4ZUsMy';
    const WHOP_CHECKOUT_SCRIPT = 'https://davidcohencontent-create.github.io/coding-test/funnel/whop-checkout.js?v=2';
    // After a completed checkout (paid, or free with a promo code or a free plan) the buyer goes straight into the course in Whop.
    // Same after an off-site payment step (Klarna, bank transfer…): Whop sends the buyer back to this URL.
    const COURSE_URL = 'https://whop.com/judithcalzadaduaigues-1bce/confianza-sin-permiso-66/';
    (() => {
      const box = document.getElementById('whop-checkout');
      if (!box || window.__jcWhopLoaded) return;
      const mount = () => window.JCWhopCheckout.mount(box, {
        plan: WHOP_PLAN_ID_CURSO,
        returnUrl: COURSE_URL,
        // A link with ?promo=CODE opens the checkout with that Whop promo code already applied (buyers can also type one in)
        promoCode: new URLSearchParams(location.search).get('promo') || undefined,
        // Paid or free: the order stands, so go to the course
        onComplete: r => { if (r && r.result !== 'waitlist_entry') location.href = COURSE_URL; },
      });
      const load = () => {
        if (window.__jcWhopLoaded) return;
        window.__jcWhopLoaded = true;
        const s = document.createElement('script');
        s.src = WHOP_CHECKOUT_SCRIPT; s.async = true; s.onload = mount;
        document.head.appendChild(s);
      };
      if (!('IntersectionObserver' in window)) return load();
      const io = new IntersectionObserver(e => { if (e.some(x => x.isIntersecting)) { io.disconnect(); load(); } }, { rootMargin: '900px 0px' });
      io.observe(box);
    })();

    // Sales page behaviour: method steps unlock as you scroll, and the Day 1 trailer's timed preview.

    // Method: each step lights up when it reaches the middle of the screen and stays unlocked.
    // Without JS, or with reduced motion, every step is simply shown.
    (() => {
      const steps = [...document.querySelectorAll('.unlock li')];
      const count = document.querySelector('[data-step]');
      const bar = document.querySelector('.progress .bar i');
      if (!steps.length || !('IntersectionObserver' in window) || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      document.documentElement.classList.add('js-unlock');
      const show = i => {
        steps.forEach((s, j) => { if (j <= i) s.classList.add('on'); });
        count.textContent = String(i + 1).padStart(2, '0');
        bar.style.setProperty('--p', (i + 1) / steps.length);
      };
      steps[0].classList.add('on');
      const io = new IntersectionObserver(entries => entries.forEach(e => {
        if (e.isIntersecting) show(steps.indexOf(e.target));
      }), { rootMargin: '-45% 0px -45% 0px' });
      steps.forEach(s => io.observe(s));
    })();

    // Trailer: plays for data-preview seconds, then pauses and shows the paywall.
    // Works with a Vimeo embed (via Vimeo's player API), a <video>, or the placeholder (the play button runs the countdown).
    (() => {
      const box = document.querySelector('.trailer[data-preview]');
      if (!box) return;
      const limit = Number(box.dataset.preview) || 60;
      const iframe = box.querySelector('iframe');
      const video = box.querySelector('video');
      const play = box.querySelector('.play');
      const timer = box.querySelector('.timer');
      const paywall = box.querySelector('.paywall');
      const fmt = s => { const t = Math.ceil(s); return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0'); };
      const render = left => { timer.textContent = 'Vista previa · ' + fmt(Math.max(0, left)); };
      const locked = () => !paywall.hidden;
      let pause = () => {};
      const lock = () => { pause(); if (play) play.hidden = true; paywall.hidden = false; render(0); };

      if (iframe) {
        if (!window.Vimeo) return; // player script blocked: the video still plays, just without the preview limit
        const player = new Vimeo.Player(iframe);
        pause = () => player.pause();
        player.on('timeupdate', d => { render(limit - d.seconds); if (d.seconds >= limit && !locked()) lock(); });
        player.on('seeked', d => { if (d.seconds > limit) player.setCurrentTime(limit); });
        player.on('play', () => { if (locked()) player.pause(); });
        player.on('ended', () => { if (!locked()) lock(); }); // the last timeupdate can land just short of the limit
      } else if (video) {
        pause = () => video.pause();
        video.addEventListener('timeupdate', () => { render(limit - video.currentTime); if (video.currentTime >= limit) lock(); });
        video.addEventListener('seeking', () => { if (video.currentTime > limit) video.currentTime = limit; });
        video.addEventListener('pause', () => { if (!locked() && play) play.hidden = false; });
        video.addEventListener('ended', () => { if (!locked()) lock(); });
      }
      let elapsed = 0, tick = null;
      play?.addEventListener('click', () => {
        play.hidden = true;
        if (video) { video.play(); return; }
        tick = setInterval(() => { elapsed++; render(limit - elapsed); if (elapsed >= limit) { clearInterval(tick); lock(); } }, 1000);
      });
      // Closing Day 1 pauses the preview
      box.closest('details')?.addEventListener('toggle', e => {
        if (e.target.open || locked()) return;
        pause();
        if (tick) { clearInterval(tick); tick = null; play.hidden = false; }
      });
    })();

    // Reviews slider: arrows and dots move one testimonial at a time; swipe and keyboard scroll natively.
    (() => {
      const track = document.querySelector('.slider .track');
      if (!track) return;
      const slides = [...track.children];
      const prev = document.querySelector('.slider .prev');
      const next = document.querySelector('.slider .next');
      const dots = document.querySelector('.dots');
      const go = i => track.scrollTo({ left: i * track.clientWidth });
      const current = () => Math.round(track.scrollLeft / track.clientWidth);
      slides.forEach((_, i) => {
        const b = document.createElement('button');
        b.type = 'button'; b.setAttribute('aria-label', 'Testimonio ' + (i + 1));
        b.addEventListener('click', () => go(i));
        dots.appendChild(b);
      });
      const update = () => {
        const i = current();
        [...dots.children].forEach((d, j) => d.classList.toggle('on', j === i));
        prev.disabled = i === 0;
        next.disabled = i === slides.length - 1;
      };
      prev.addEventListener('click', () => go(current() - 1));
      next.addEventListener('click', () => go(current() + 1));
      track.addEventListener('scroll', () => requestAnimationFrame(update), { passive: true });
      update();
    })();

    // Logo strip: duplicate the row so the loop is seamless (skipped for reduced motion: logos stay still, centred)
    (() => {
      const row = document.querySelector('.logo-row');
      if (!row || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      [...row.children].forEach(img => { const c = img.cloneNode(); c.alt = ''; row.appendChild(c); });
      row.classList.add('run');
    })();

    // External images (logos) that fail to load: reviewer logos fall back to the grey placeholder, strip logos are removed
    document.querySelectorAll('img[data-fallback]').forEach(img => {
      const fail = () => {
        if (img.classList.contains('avatar')) {
          const d = document.createElement('div');
          d.className = 'avatar'; d.setAttribute('role', 'img'); d.setAttribute('aria-label', img.alt);
          img.replaceWith(d);
        } else img.remove();
      };
      if (img.complete && img.naturalWidth === 0) fail(); else img.addEventListener('error', fail);
    });

    // Mascot: a small yellow character that now and then peeks in from the left, right or bottom edge, blinks, types on its
    // laptop and follows the cursor with its eyes. Click it and it jumps and says something kind, then hides again.
    // It stays away while the checkout is on screen, never shows for reduced motion, and its styles come with it (GHL-safe).
    (() => {
      if (window.__jcMascot || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      window.__jcMascot = true;
      const css = `
      .jm{position:fixed;z-index:70;width:112px;height:112px;pointer-events:none;transition:transform .9s cubic-bezier(.34,1.4,.5,1)}
      .jm svg{display:block;width:100%;height:100%;overflow:visible;pointer-events:auto;cursor:inherit;filter:drop-shadow(0 8px 14px rgba(0,0,0,.12))}
      .jm[data-side=bottom]{bottom:0;transform:translateY(105%)}
      .jm[data-side=bottom].on{transform:translateY(30%)}
      .jm[data-side=left]{left:0;transform:translateX(-105%) rotate(90deg)}
      .jm[data-side=left].on{transform:translateX(-30%) rotate(90deg)}
      .jm[data-side=right]{right:0;transform:translateX(105%) rotate(-90deg)}
      .jm[data-side=right].on{transform:translateX(30%) rotate(-90deg)}
      .jm .jm-face{transition:transform .18s ease-out}
      .jm .jm-eyes{transform-box:fill-box;transform-origin:center;animation:jm-blink 4.6s infinite}
      .jm .jm-hands{transform-box:fill-box;transform-origin:50% 100%;animation:jm-tap 1.1s ease-in-out infinite}
      .jm .jm-laptop{transform-box:fill-box;transform-origin:50% 100%}
      .jm .jm-o,.jm .jm-dash{opacity:0;transition:opacity .12s}
      .jm .jm-smile{transition:opacity .12s}
      .jm.up .jm-hands,.jm.up .jm-laptop{animation:jm-bump 1s ease-in-out 1}
      .jm.up .jm-body{animation:jm-hop .6s ease-out 1}
      .jm.up .jm-smile{opacity:0}
      .jm.up .jm-o,.jm.up .jm-dash{opacity:1}
      .jm-say{position:fixed;z-index:71;bottom:96px;padding:10px 16px;background:#fff;border:1.5px solid #161616;border-radius:18px;
        font:26px/1 'Reenie Beanie','Comic Sans MS',cursive;color:#161616;white-space:nowrap;pointer-events:none;
        opacity:0;transform:translateY(8px) scale(.96);transition:opacity .25s,transform .35s cubic-bezier(.34,1.4,.5,1)}
      .jm-say.on{opacity:1;transform:none}
      @keyframes jm-blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.12)}}
      @keyframes jm-tap{0%,100%{transform:translateY(0)}30%{transform:translateY(2.4px)}55%{transform:translateY(0)}80%{transform:translateY(2px)}}
      @keyframes jm-bump{0%{transform:translateY(0)}22%{transform:translateY(-10px)}78%{transform:translateY(-10px)}100%{transform:translateY(0)}}
      @keyframes jm-hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-6px)}}
      @media (max-width:760px){.jm{width:84px;height:84px}.jm-say{bottom:72px;font-size:22px}}`;
      const st = document.createElement('style'); st.textContent = css; document.head.appendChild(st);

      // Original character: a rounded yellow block with a face, little legs and a laptop it types on
      const el = document.createElement('div');
      el.className = 'jm'; el.setAttribute('aria-hidden', 'true');
      el.innerHTML = `<svg viewBox="0 0 120 120">
        <g class="jm-body">
          <path d="M44 100v14M74 100v14" stroke="#161616" stroke-width="3" stroke-linecap="round"/>
          <rect x="26" y="18" width="68" height="84" rx="22" fill="#f5c542" stroke="#161616" stroke-width="3"/>
          <path d="M36 28c6-5 14-7 22-7" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".55" fill="none"/>
          <g class="jm-face">
            <g class="jm-eyes"><circle cx="50" cy="48" r="3.4" fill="#161616"/><circle cx="70" cy="48" r="3.4" fill="#161616"/></g>
            <circle cx="43" cy="58" r="4" fill="#ef8f6b" opacity=".35"/><circle cx="77" cy="58" r="4" fill="#ef8f6b" opacity=".35"/>
            <path class="jm-smile" d="M52 58q8 7 16 0" stroke="#161616" stroke-width="2.6" stroke-linecap="round" fill="none"/>
            <ellipse class="jm-o" cx="60" cy="60" rx="3.6" ry="4.4" fill="#161616"/>
          </g>
          <g class="jm-dash" stroke="#161616" stroke-width="2.4" stroke-linecap="round"><path d="M18 18l-6-6M60 6V-2M102 18l6-6"/></g>
          <g class="jm-laptop">
            <path d="M34 80h52l-4 16H38z" fill="#fff" stroke="#161616" stroke-width="2.6" stroke-linejoin="round"/>
            <path d="M30 96h60" stroke="#161616" stroke-width="3" stroke-linecap="round"/>
            <circle cx="60" cy="88" r="2.2" fill="#f5c542"/>
          </g>
          <g class="jm-hands" fill="#fff" stroke="#161616" stroke-width="2.6">
            <ellipse cx="38" cy="80" rx="7" ry="5.5"/><ellipse cx="82" cy="80" rx="7" ry="5.5"/>
          </g>
        </g></svg>`;
      const say = document.createElement('div'); say.className = 'jm-say';
      document.body.append(el, say);

      const LINES = ['¡Tú puedes!', 'Confía en ti', 'Sin esperar más', 'Ya estás preparada', 'Un paso cada día', '¡Hola!'];
      const pick = a => a[Math.floor(Math.random() * a.length)];
      const rand = (a, b) => a + Math.random() * (b - a);
      const mobile = () => innerWidth < 760;
      const checkout = document.getElementById('checkout');
      let hideT, nextT, hovering = false;

      // Stay away from the payment form
      let checkoutVisible = false;
      if (checkout && 'IntersectionObserver' in window)
        new IntersectionObserver(e => { checkoutVisible = e[0].isIntersecting; if (checkoutVisible) hide(); }).observe(checkout);

      function place() {
        const side = mobile() ? 'bottom' : pick(['bottom', 'bottom', 'left', 'right']);
        el.dataset.side = side; el.style.left = el.style.top = '';
        if (side === 'bottom') el.style.left = Math.round(rand(.08, .82) * (innerWidth - 112)) + 'px';
        else el.style.top = Math.round(rand(.3, .75) * innerHeight) + 'px';
        return side;
      }
      function show() {
        clearTimeout(nextT);
        if (document.hidden || checkoutVisible) return schedule();
        el.classList.remove('on', 'up');
        const side = place();
        void el.offsetWidth; // restart the slide-in from the hidden position
        el.classList.add('on');
        if (side === 'bottom' && Math.random() < .6) setTimeout(() => talk(pick(LINES)), 700);
        hideT = setTimeout(() => { if (!hovering) hide(); else hideT = setTimeout(hide, 2500); }, rand(4200, 5600));
      }
      function talk(text) {
        if (el.dataset.side !== 'bottom') return;
        const r = el.getBoundingClientRect();
        say.textContent = text;
        say.style.left = Math.max(12, Math.min(innerWidth - 220, r.left + r.width * .55)) + 'px';
        say.classList.add('on');
      }
      function hide() {
        clearTimeout(hideT); say.classList.remove('on');
        if (el.classList.contains('on')) { el.classList.remove('on'); schedule(); }
      }
      function schedule() { clearTimeout(nextT); nextT = setTimeout(show, mobile() ? rand(20000, 32000) : rand(13000, 22000)); }

      // Click: jump, "o" mouth, a kind word, then off it goes
      el.addEventListener('click', () => {
        el.classList.remove('up'); void el.offsetWidth; el.classList.add('up');
        talk(pick(LINES.slice(0, 5)));
        clearTimeout(hideT); hideT = setTimeout(hide, 1800);
      });
      el.addEventListener('mouseenter', () => { hovering = true; });
      el.addEventListener('mouseleave', () => { hovering = false; });

      // Eyes and face follow the cursor
      const face = el.querySelector('.jm-face');
      let mx = 0, my = 0, raf = 0;
      addEventListener('mousemove', e => {
        mx = e.clientX; my = e.clientY;
        if (raf || !el.classList.contains('on')) return;
        raf = requestAnimationFrame(() => {
          raf = 0;
          const r = el.getBoundingClientRect();
          let dx = mx - (r.left + r.width / 2), dy = my - (r.top + r.height / 2);
          const side = el.dataset.side; // the svg is turned on the sides, so turn the direction with it
          if (side === 'left') [dx, dy] = [dy, -dx];
          if (side === 'right') [dx, dy] = [-dy, dx];
          const d = Math.hypot(dx, dy) || 1, k = Math.min(1, d / 300);
          face.style.transform = `translate(${(dx / d * 4 * k).toFixed(2)}px,${(dy / d * 3 * k).toFixed(2)}px)`;
        });
      }, { passive: true });

      nextT = setTimeout(show, 6000);
    })();
    return true;
  }
  // GHL renders the page in stages: try on load, then retry briefly until the sections exist.
  var tries = 0;
  function tick() { if (!start() && !window.__jcStarted && tries++ < 40) setTimeout(tick, 250); }
  if (document.readyState === 'complete') setTimeout(tick, 300);
  else window.addEventListener('load', function () { setTimeout(tick, 300); });
})();
</script>
