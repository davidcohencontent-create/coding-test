<div class="jc">
<header>
  <!-- Workshop bar: "Workshop gratuito en directo" and a countdown to 15 Dec 19:00 (Madrid). It hides itself once the workshop has started. -->
  <style>
    .wbar{background:var(--accent);color:#fff}
    header .wbar .wrap{display:flex;justify-content:center;align-items:center;gap:20px;height:auto;min-height:60px;padding-top:10px;padding-bottom:10px}
    .wbar-title{font-size:13px;font-weight:600;letter-spacing:.18em;text-transform:uppercase}
    .wbar-cd{display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
    .wbar-cd div{min-width:42px;padding:4px 4px 3px;border:1px solid rgba(255,255,255,.28);text-align:center}
    .wbar-cd b{display:block;font-family:var(--serif);font-weight:500;font-size:19px;line-height:1}
    .wbar-cd i{display:block;margin-top:2px;font-style:normal;font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.7)}
    @media (max-width:560px){header .wbar .wrap{flex-direction:column;gap:7px}.wbar-title{font-size:11px;letter-spacing:.14em}}
  </style>
  <div class="wbar" data-workshop="2026-12-15T19:00:00+01:00">
    <div class="wrap">
      <span class="wbar-title">Workshop gratuito en directo</span>
      <div class="wbar-cd" aria-label="Cuenta atrás hasta el workshop">
        <div><b data-w="d">00</b><i>días</i></div>
        <div><b data-w="h">00</b><i>h</i></div>
        <div><b data-w="m">00</b><i>min</i></div>
        <div><b data-w="s">00</b><i>seg</i></div>
      </div>
    </div>
  </div>
  <script>
  (function () {
    var bar = document.querySelector('.wbar');
    if (!bar || bar.dataset.run) return;
    bar.dataset.run = '1';
    var end = new Date(bar.getAttribute('data-workshop')).getTime(), pad = function (n) { return (n < 10 ? '0' : '') + n; };
    var tick = function () {
      var t = end - Date.now();
      if (t <= 0) { bar.hidden = true; return; }               // workshop started: the bar goes away
      var s = Math.floor(t / 1000);
      bar.querySelector('[data-w=d]').textContent = pad(Math.floor(s / 86400));
      bar.querySelector('[data-w=h]').textContent = pad(Math.floor(s % 86400 / 3600));
      bar.querySelector('[data-w=m]').textContent = pad(Math.floor(s % 3600 / 60));
      bar.querySelector('[data-w=s]').textContent = pad(s % 60);
      setTimeout(tick, 1000 - Date.now() % 1000);
    };
    tick();
  })();
  </script>
</header>
</div>
