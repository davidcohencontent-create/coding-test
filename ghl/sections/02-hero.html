<div class="jc">
  <!-- Hero: heading, subheading, video, then the CTA -->
  <section class="hero">
    <div class="wrap">
      <div class="intro">
        <h1>Te ayudo a dejar de esperar <em class="nowrap">a sentirte preparada</em> para ocupar el lugar que ya te has ganado.</h1>
        <p>Dejé de esperar a sentirme preparada. Actué con miedo. Y en 10 días, ese miedo se convirtió en confianza.</p>
      </div>
      <!-- Video with Judith's cover image on top: clicking the cover hides it and starts the video -->
      <style>
        .video .poster{position:absolute;inset:0;z-index:2;width:100%;height:100%;border:0;padding:0;margin:0;cursor:pointer;
          background:#18172a url("https://files.leadconnectorhq.com/file/6aecb3f8fe82b1ad5fbb02df/image-1793897452777.jpg") center/cover no-repeat}
        .video .poster::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(24,23,42,0) 55%,rgba(24,23,42,.35))}
      </style>
      <div class="video">
        <iframe src="https://player.vimeo.com/video/1211423165?title=0&amp;byline=0&amp;portrait=0&amp;dnt=1&amp;color=5d0018" title="Vídeo de Judith Calzada" allow="autoplay; fullscreen; picture-in-picture; clipboard-write; encrypted-media; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
        <button class="poster" type="button" aria-label="Reproducir el vídeo"><span class="play" aria-hidden="true"></span></button>
      </div>
      <script>
      (function () {
        var b = document.querySelector('.video .poster');
        if (!b || b.dataset.ready) return;
        b.dataset.ready = '1';
        b.addEventListener('click', function () {
          var f = b.parentNode.querySelector('iframe');
          b.hidden = true;
          var start = function () { if (!/autoplay=1/.test(f.src)) f.src += '&autoplay=1'; };
          if (window.Vimeo && window.Vimeo.Player) new window.Vimeo.Player(f).play().catch(start); else start();
        });
      })();
      </script>
      <div class="cta">
        <a href="#precios" class="btn light">Quiero más confianza</a>
        <p class="proof">+500 profesionales acompañados · <span class="stars" aria-hidden="true">★★★★★</span> 4,8/5</p>
      </div>
    </div>
  </section>
  <div class="band"></div>
</div>
