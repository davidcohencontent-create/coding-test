<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,500;1,400;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:1200px;height:630px;overflow:hidden;background:#f3f1ef;font-family:Inter,Helvetica,Arial,sans-serif;color:#1d1b26;position:relative}
.left{position:absolute;left:64px;top:56px;width:540px;height:518px;display:flex;flex-direction:column}
.logo{font-family:'EB Garamond',serif;font-weight:500;font-size:42px;letter-spacing:.005em;line-height:1}
.logo small{display:block;margin-top:8px;font-family:Inter,sans-serif;font-size:13px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:#5d0018}
h1{margin-top:auto;font-weight:400;font-size:42px;line-height:1.14;letter-spacing:-.02em;white-space:nowrap}
h1 em{font-family:'EB Garamond',serif;font-style:italic;font-weight:400;font-size:50px;letter-spacing:-.01em;color:#5d0018}
.tag{display:inline-flex;align-items:center;gap:10px;margin-top:30px;align-self:flex-start;background:#5d0018;color:#fff;font-size:15px;font-weight:600;letter-spacing:.04em;padding:11px 18px;border-radius:999px;position:relative}
.tag b{font-weight:500;color:#f1cfd7}
.grid{position:absolute;left:640px;top:0;width:600px;height:630px;display:grid;grid-template-columns:repeat(3,172px);gap:14px}
.col{display:flex;flex-direction:column;gap:14px}
.col:nth-child(1){margin-top:24px}
.col:nth-child(2){margin-top:-40px}
.col:nth-child(3){margin-top:4px}
.ph{position:relative;height:200px;border-radius:10px;overflow:hidden;background:#ddd}
.ph.t{height:250px}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 35%,rgba(0,0,0,.45))}
.ph span{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);z-index:1;text-align:center;color:#fff;font-weight:700;font-size:21px;letter-spacing:-.01em;text-shadow:0 2px 10px rgba(0,0,0,.45)}
.ph span.s{font-family:'EB Garamond',serif;font-style:italic;font-weight:500;font-size:28px;letter-spacing:0}
.ph span.c{font-size:15px;letter-spacing:.2em;text-transform:uppercase}
</style></head><body>
<div class="left">
  <div class="logo">Judith Calzada<small>Intensivo de la Confianza</small></div>
  <h1>Te ayudo a <em>dejar de esperar</em><br><em>a sentirte preparada</em><br>para ocupar el lugar<br>que ya te has <em>ganado.</em></h1>
  <span class="tag">10 días · 11 lecciones <b>· Próximamente</b></span>
</div>
<div class="grid">
  <div class="col">
    <div class="ph t"><img src="file:///home/user/coding-test/funnel/img/paso-5.jpg" style="object-position:30% 50%"><span>TEDx</span></div>
    <div class="ph"><img src="file:///home/user/coding-test/funnel/img/paso-ingles.jpg" style="object-position:50% 30%"><span class="c">Profesora</span></div>
    <div class="ph"><img src="file:///home/user/coding-test/funnel/img/paso-6.jpg"><span class="s">Entrevistas</span></div>
  </div>
  <div class="col">
    <div class="ph t"><img src="file:///home/user/coding-test/funnel/img/paso-3.jpg" style="object-position:50% 40%"></div>
    <div class="ph"><img src="file:///home/user/coding-test/funnel/img/paso-2.jpg" style="object-position:40% 30%"><span class="s">Conferencias</span></div>
    <div class="ph t"><img src="file:///home/user/coding-test/funnel/img/esade.jpg"><span>ESADE</span></div>
  </div>
  <div class="col">
    <div class="ph"><img src="file:///home/user/coding-test/funnel/img/paso-4.jpg" style="object-position:50% 30%"><span class="c">Liderazgo</span></div>
    <div class="ph t"><img src="file:///home/user/coding-test/funnel/img/conferencia.jpg" style="object-position:50% 30%"><span class="s">Ponente</span></div>
    <div class="ph"><img src="file:///home/user/coding-test/funnel/img/paso-1.jpg"><span class="c">Universidad</span></div>
  </div>
</div>
</body></html>
