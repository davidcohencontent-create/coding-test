<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Outreach CRM</title>
<style>
/* Layout: read-only scoreboard in one column. Claude logs every DM; nothing to click. */
:root{
  --bg:#f7f7f5; --panel:#fff; --ink:#1b1a1f; --muted:#75737d; --line:#e6e5ea; --soft:#f0eff3;
  --accent:#4f46e5; --good:#15803d;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#111014; --panel:#1a191e; --ink:#f2f1f5; --muted:#a09ea8; --line:#2b2a31; --soft:#24232a;
    --accent:#8b85ff; --good:#4ade80; color-scheme:dark; }
}
:root[data-theme="dark"]{ --bg:#111014; --panel:#1a191e; --ink:#f2f1f5; --muted:#a09ea8; --line:#2b2a31; --soft:#24232a;
  --accent:#8b85ff; --good:#4ade80; color-scheme:dark; }
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:720px;margin:0 auto;padding:28px 16px 60px;display:grid;gap:18px}
main>*{min-width:0}
h1{font-size:20px;margin:0}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:10px 0 -8px;font-weight:600}
.muted{color:var(--muted)}
.small{font-size:13px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat b{display:block;font-size:26px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.stat.hero{border-color:var(--accent)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
td,th{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:500}
tr:last-child td{border-bottom:0}
.num{text-align:right;white-space:nowrap}
.badge{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.03em;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--muted);vertical-align:middle;white-space:nowrap}
.badge.win{background:var(--good);color:var(--panel)}
.badge.replied{color:var(--good)}
.badge.booked{background:var(--good);color:var(--panel)}
.dm{padding:12px 14px;border-bottom:1px solid var(--line);display:grid;gap:4px}
.dm:last-child{border-bottom:0}
.dm .top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dm a{color:var(--ink);font-weight:600;text-decoration:none}
.dm a:hover{text-decoration:underline}
.dm q{display:block;font-size:13px;color:var(--muted);quotes:none;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.tip{font-size:14px;padding:12px 14px;background:var(--soft);border-radius:10px}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
@media (max-width:560px){ .stats{grid-template-columns:repeat(2,1fr)} }
</style>
</head>
<body>
<main>
  <div>
    <h1>Outreach CRM</h1>
    <div class="muted small">Send Claude the opener screenshot, the profile link and the Loom transcript. Claude logs it here and keeps score.</div>
  </div>
  <div id="app"><div class="card empty">Loading your DMs…</div></div>
</main>

<script>
// Each DM is one document in the "dms" collection, written by Claude:
// { handle, url, sentAt, opener, angle, loomHook, loomSummary, replied, repliedAt, booked, notes }
const MIN = 10; // sends per opener style before calling a winner

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pct = (a,b) => b ? Math.round(1000*a/b)/10 + '%' : '—';
const day = iso => iso ? new Date(iso).toLocaleDateString(undefined, { month:'short', day:'numeric' }) : '';

// Wilson lower bound: ranks reply rates without being fooled by tiny samples.
function wilson(k,n){
  if(!n) return 0;
  const z=1.96, p=k/n;
  return (p + z*z/(2*n) - z*Math.sqrt(p*(1-p)/n + z*z/(4*n*n))) / (1+z*z/n);
}

function render(dms){
  const app = document.getElementById('app');
  const sent = dms.length;
  const replies = dms.filter(d => d.replied || d.booked).length;
  const booked = dms.filter(d => d.booked).length;

  const groups = {};
  for(const d of dms){
    const k = d.angle || 'Unlabelled';
    const g = groups[k] ||= { angle:k, sent:0, replies:0, booked:0 };
    g.sent++; if(d.replied || d.booked) g.replies++; if(d.booked) g.booked++;
  }
  const angles = Object.values(groups).map(g => ({ ...g, score: wilson(g.replies, g.sent) })).sort((a,b) => b.score-a.score || b.sent-a.sent);
  const best = angles.find(g => g.sent >= MIN && g.replies > 0);

  let tip;
  if(!sent) tip = 'Nothing logged yet. Send Claude your first DM: the opener screenshot, the profile link and the Loom transcript.';
  else if(best) tip = `<b>${esc(best.angle)}</b> works best so far: ${pct(best.replies,best.sent)} reply rate over ${best.sent} DMs. Ask Claude how to beat it.`;
  else tip = `Each opener style needs ${MIN} DMs before a winner is clear. Keep sending.`;

  const recent = dms.slice().sort((a,b) => String(b.sentAt).localeCompare(String(a.sentAt)));

  app.style.display = 'grid'; app.style.gap = '18px';
  app.innerHTML = `
  <div class="stats">
    <div class="stat"><span>DMs sent</span><b>${sent}</b></div>
    <div class="stat"><span>Replies</span><b>${replies}</b></div>
    <div class="stat hero"><span>Response rate</span><b>${pct(replies,sent)}</b></div>
    <div class="stat"><span>Calls booked</span><b>${booked}</b></div>
  </div>
  <div class="tip">${tip}</div>

  ${angles.length ? `
  <h2>Opener styles</h2>
  <div class="card" style="overflow-x:auto"><table>
    <tr><th>Style</th><th class="num">Sent</th><th class="num">Replies</th><th class="num">Rate</th></tr>
    ${angles.map(g => `<tr>
      <td>${esc(g.angle)} ${best && g.angle===best.angle ? '<span class="badge win">BEST</span>' : ''}</td>
      <td class="num">${g.sent}</td><td class="num">${g.replies}</td><td class="num"><b>${pct(g.replies,g.sent)}</b></td>
    </tr>`).join('')}
  </table></div>` : ''}

  ${recent.length ? `
  <h2>All DMs</h2>
  <div class="card">
    ${recent.map(d => `<div class="dm">
      <div class="top">
        <a href="${esc(d.url || 'https://instagram.com/'+encodeURIComponent(d.handle||''))}" target="_blank" rel="noopener">@${esc(d.handle)}</a>
        <span class="muted small">${esc(day(d.sentAt))}${d.angle ? ' · '+esc(d.angle) : ''}</span>
        <span style="flex:1"></span>
        ${d.booked ? '<span class="badge booked">Booked</span>' : (d.replied ? '<span class="badge replied">Replied</span>' : '<span class="badge">Waiting</span>')}
      </div>
      ${d.opener ? `<q>${esc(d.opener)}</q>` : ''}
      ${d.notes ? `<div class="small muted">${esc(d.notes)}</div>` : ''}
    </div>`).join('')}
  </div>` : ''}`;
}

(async () => {
  const db = window.claude?.use ? await window.claude.use('db') : null;
  if(!db){
    document.getElementById('app').innerHTML = '<div class="card empty">Open this page in Claude to see your DMs.</div>';
    return;
  }
  db.collection('dms').onSnapshot(
    snap => render(snap.docs.map(d => d.data())),
    () => { document.getElementById('app').innerHTML = '<div class="card empty">Couldn\'t load your DMs. Reload the page to try again.</div>'; }
  );
})();
</script>
</body>
</html>
