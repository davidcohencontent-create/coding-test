<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Outreach CRM</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: three screens in one narrow column. Start = goal + 3-step DM log, To contact = queue, Tracking = pipeline.
   Look: white paper, soft grey panels, condensed serif with italic accents; every action that moves a lead forward glows sky blue into hot pink.
   Hot pink alone marks follow-ups, green wins, red missed. Single light theme by design. */
:root{
  --bg:#ffffff; --panel:#ffffff; --ink:#151515; --muted:#6f6f6f; --line:#ebebeb; --soft:#f6f6f5;
  --accent:#0593c6; --accent-deep:#047aa6; --pink:#d83995; --accent-ink:#ffffff; --grad:linear-gradient(115deg,#0593c6 0%,#4a78cf 48%,#d83995 100%); --good:#1e9e57; --fu:#d83995; --bad:#d84a4a;
  --serif:'Instrument Serif', Georgia, 'Times New Roman', serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;letter-spacing:-.01em}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
header .in{max-width:720px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
header h1{font-size:15px;margin:0;font-weight:650;flex:1}
nav{display:flex;gap:2px}
nav button{background:none;border:0;padding:6px 14px;border-radius:999px;color:var(--muted);font:inherit;cursor:pointer}
nav button.on{background:var(--ink);color:var(--bg);font-weight:600}
nav .count{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:999px;background:var(--fu);color:#000;font-size:11px;font-weight:700;line-height:18px;text-align:center}
main{max-width:720px;margin:0 auto;padding:20px 16px 60px;display:grid;gap:16px}
main>*,section>*{min-width:0}
section{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
button{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:8px 14px;border-radius:8px;cursor:pointer}
button:hover{border-color:var(--muted)}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.big{font-size:17px;padding:16px 20px;border-radius:12px;width:100%}
.sm{font-size:12px;padding:4px 10px}
input,textarea{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%}
textarea{resize:vertical}
input:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
label.f{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.muted{color:var(--muted)}
.small{font-size:13px}
h2{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin:6px 0 -8px;font-weight:600}
/* daily goal */
.goal{display:grid;gap:10px}
.goal .n{font-size:34px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.goal .n small{font-size:16px;color:var(--muted);font-weight:500}
.slots{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.slots i{height:10px;border-radius:5px;background:var(--soft)}
.slots i.on{background:var(--accent)}
.slots.done i.on{background:var(--good)}
.slots i{height:6px}
.cons{display:grid;gap:12px}
.cons .nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cons .nums div{background:var(--soft);border-radius:10px;padding:10px 12px}
.cons .nums b{display:block;font-size:22px;font-variant-numeric:tabular-nums;line-height:1.2}
.cons .nums span{font-size:11px;color:var(--muted)}
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;max-width:300px}
.heat i{aspect-ratio:1;max-width:100%;border-radius:4px;background:var(--soft);display:grid;place-items:center;font-style:normal;font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}
.heat i.l1{background:#262626;color:var(--ink)} .heat i.l2{background:#4a4a4a;color:var(--ink)} .heat i.hit{background:var(--ink);color:var(--bg);font-weight:700}
.heat i.today{outline:1px solid var(--ink);outline-offset:1px}
.heat i.future{background:none}
.heat .dow{background:none;aspect-ratio:auto;font-size:10px}
.legend{display:flex;gap:10px;align-items:center;font-size:11px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;vertical-align:-1px;margin-right:4px}
/* stepper */
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;font-size:12px;color:var(--muted)}
.steps div{border-top:3px solid var(--soft);padding-top:6px}
.steps div.on{border-color:var(--accent);color:var(--ink);font-weight:600}
.steps div.past{border-color:var(--accent)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg button{padding:9px 8px}
.seg button.on{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}
.drop{display:grid;place-items:center;min-height:120px;border:1px dashed #3a3a3a;border-radius:10px;color:var(--muted);font-size:13px;cursor:pointer;padding:10px;text-align:center}
.drop:hover{border-color:var(--muted)}
.drop.over,.dm.over{border-color:var(--ink);background:var(--soft)}
.crit{display:grid;gap:6px}
.crit div{display:grid;grid-template-columns:minmax(0,9rem) 1fr 2.2rem;gap:8px;align-items:center;font-size:12px;color:var(--muted)}
.crit i{height:4px;background:var(--soft);border-radius:2px;overflow:hidden}
.crit i b{display:block;height:100%;background:var(--ink)}
.crit span{text-align:right;color:var(--ink);font-variant-numeric:tabular-nums}
.btnlike{display:inline-block;font-size:12px;padding:4px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);cursor:pointer}
.btnlike:hover{border-color:var(--muted)}
.fu-h{color:var(--fu)}
a.ig{color:var(--ink);text-decoration:none;cursor:pointer}
a.ig::after{content:' ↗';font-size:.8em;color:var(--muted);transition:color .15s}
a.ig:hover{text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--accent)}
a.ig:hover::after{color:var(--accent)}
.ig-btn{white-space:nowrap}
@media (max-width:420px){ .ig-btn{display:none} }
.stat small{display:block;font-size:11px;color:var(--muted);margin-top:2px}
nav .lc{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:999px;background:var(--soft);color:var(--ink);font-size:11px;font-weight:700;line-height:18px;text-align:center}
nav button.on .lc{background:var(--bg);color:var(--ink)}
.lead{display:flex;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
.lead:last-child{border-bottom:0}
.lead .who{flex:1;min-width:0}
.lead .who a{color:var(--ink);font-weight:600;text-decoration:none}
.lead .who a:hover{text-decoration:underline}
.lead .who div{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lead .x{border:0;background:none;color:var(--muted);padding:6px 8px}
.lead .x:hover{color:var(--bad)}
.next-up{font-size:13px;color:var(--muted);text-align:center}
@media (max-width:480px){ header h1{display:none} header .in{justify-content:center} nav button{padding:6px 11px} }
.fu-card{border-color:var(--fu)}
.fu-card .steps{grid-template-columns:repeat(2,1fr)}
.fu-card .steps div.on,.fu-card .steps div.past{border-color:var(--fu)}
.fuitem{padding:12px 14px;border-bottom:1px solid var(--line);display:grid;gap:4px}
.fuitem:last-child{border-bottom:0}
.fuitem .top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.fuitem .txt{font-size:13px;white-space:pre-line;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.fuitem img{max-width:100%;max-height:320px;border-radius:8px;display:block;margin-top:6px}
.fuitem pre{white-space:pre-wrap;font:inherit;font-size:13px;background:var(--soft);padding:8px 10px;border-radius:8px;margin:6px 0 0;max-height:200px;overflow:auto}
.fuitem summary{cursor:pointer;font-size:12px;color:var(--muted)}
.rank{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-bottom:1px solid var(--line)}
.rank:last-child{border-bottom:0}
.rank .pos{font-size:20px;font-weight:700;width:1.5em;line-height:1.2;font-variant-numeric:tabular-nums;color:var(--muted)}
.rank:first-child .pos{color:var(--ink)}
.rank .txt{font-size:14px;white-space:pre-line;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.book{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:8px}
.book input{width:auto;padding:5px 8px;font-size:13px;color-scheme:dark}
.call{display:flex;gap:10px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.call:last-child{border-bottom:0}
.call .when{font-variant-numeric:tabular-nums;font-weight:600;min-width:0}
.next-call{font-size:13px;padding:10px 14px;border:1px solid var(--line);border-radius:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.drop img,.dm img{max-width:100%;max-height:320px;border-radius:8px;display:block}
.er{font-size:13px;padding:8px 10px;background:var(--soft);border-radius:8px}
/* scores & metrics */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat b{display:block;font-size:24px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.stat.hero{border-color:#3a3a3a}
.score{display:flex;gap:16px;align-items:center}
.score .big-n{font-size:44px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--muted);white-space:nowrap}
.pill.good{color:var(--good)} .pill.fu{background:var(--fu);color:#000} .pill.fu-soft{color:var(--fu)} .pill.bad{color:var(--bad)} .pill.solid{background:var(--good);color:#000}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
td,th{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left}
th{font-size:12px;color:var(--muted);font-weight:500}
tr:last-child td{border-bottom:0}
.num{text-align:right;white-space:nowrap}
.list{padding:0}
.dm{padding:12px 14px;border-bottom:1px solid var(--line)}
.dm:last-child{border-bottom:0}
.dm .top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dm a{color:var(--ink);font-weight:600;text-decoration:none}
.dm a:hover{text-decoration:underline}
.dm details{margin-top:6px}
.dm summary{cursor:pointer;font-size:12px;color:var(--muted)}
.dm pre{white-space:pre-wrap;font:inherit;font-size:13px;background:var(--soft);padding:8px 10px;border-radius:8px;margin:6px 0 0;max-height:200px;overflow:auto}
.empty{padding:24px 16px;text-align:center;color:var(--muted)}
.notice{font-size:14px;padding:12px 14px;background:var(--soft);border-radius:10px}
.toast{border:1px solid var(--line);position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50;max-width:calc(100vw - 32px)}
.toast.show{opacity:1}
@media (max-width:560px){ .stats{grid-template-columns:repeat(2,1fr)} .grid3{grid-template-columns:1fr 1fr} .grid3 label:first-child{grid-column:1/-1} }
/* ===== Light editorial skin ===== */
header{background:rgba(255,255,255,.88);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px)}
header h1{font-family:var(--serif);font-weight:400;font-size:26px;letter-spacing:-.01em;line-height:1}
header h1 i,h2 i{font-style:italic}
nav button{font-size:14px;font-weight:500;transition:background .2s,color .2s}
nav button:hover{color:var(--ink)}
nav button.on{background:var(--soft);color:var(--ink);font-weight:600}
nav .lc{background:var(--accent);color:#fff}
nav button.on .lc{background:var(--accent);color:#fff}
nav .count{background:var(--pink);color:#fff}
h2{font-family:var(--serif);font-weight:400;font-size:26px;letter-spacing:-.01em;text-transform:none;color:var(--ink);margin:14px 0 -6px;line-height:1.1}
h2.fu-h{color:var(--ink)} h2.fu-h::after{content:'';display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--fu);margin-left:8px;vertical-align:4px}
.card{border-radius:20px;border-color:var(--line);box-shadow:0 1px 0 rgba(0,0,0,.02)}
.list{padding:2px 0}
.notice,.er{background:var(--soft);border-radius:14px}
input,textarea{background:var(--soft);border-color:transparent;border-radius:12px}
input:focus,textarea:focus{outline:2px solid var(--accent);background:#fff}
label.f{color:var(--muted)}

/* buttons: quiet pills; the yellow pill is the next step, with a soft glow underneath like a lamp */
button,.btnlike{border-radius:999px;border-color:var(--line);background:#fff;color:var(--ink);transition:transform .15s ease,box-shadow .2s ease,border-color .2s,background .2s}
button:hover,.btnlike:hover{border-color:#cfcfcf;transform:translateY(-1px)}
button:active,.btnlike:active{transform:translateY(0) scale(.97)}
.primary{position:relative;isolation:isolate;background:var(--grad);border-color:transparent;color:#fff;font-weight:600;box-shadow:0 10px 24px -10px rgba(5,147,198,.75),0 12px 26px -14px rgba(216,57,149,.7)}
.primary::after{content:'';position:absolute;z-index:-1;left:14%;right:14%;bottom:-10px;height:18px;border-radius:50%;background:var(--grad);filter:blur(12px);opacity:.55;transition:opacity .25s,transform .25s}
.primary:hover{background:var(--grad);border-color:transparent;box-shadow:0 14px 30px -10px rgba(5,147,198,.85),0 16px 32px -12px rgba(216,57,149,.8)}
.primary:hover::after{opacity:.85;transform:scaleX(1.15)}
.primary.go::before{content:'';position:absolute;inset:0;border-radius:inherit;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.45) 48%,transparent 66%);background-size:250% 100%;animation:shine 3.2s ease-in-out infinite;pointer-events:none}
.big{border-radius:999px;font-size:18px;padding:17px 22px}
.big.primary{animation:breathe 2.8s ease-in-out infinite}
.big.primary::after{content:'';}
.arrow{display:inline-block;margin-left:8px;transition:transform .2s}
button:hover .arrow{transform:translate(2px,-2px)}
@keyframes shine{0%,35%{background-position:120% 0}70%,100%{background-position:-120% 0}}
@keyframes breathe{0%,100%{box-shadow:0 10px 24px -10px rgba(5,147,198,.7),0 12px 26px -14px rgba(216,57,149,.6)}50%{box-shadow:0 16px 36px -8px rgba(5,147,198,.85),0 18px 40px -10px rgba(216,57,149,.85),0 0 0 6px rgba(5,147,198,.10)}}

/* segmented pickers */
.seg button{border-radius:14px;background:var(--soft);border-color:transparent}
.seg button.on{background:#fff;color:var(--ink);border-color:var(--ink);box-shadow:0 0 0 1px var(--ink) inset}
/* goal + consistency */
.goal .n{font-family:var(--serif);font-weight:400;font-size:56px}
.slots i{height:8px;border-radius:4px;background:var(--soft);transition:background .4s}
.slots i.on{background:var(--grad);background-size:500% 100%;box-shadow:0 0 12px rgba(5,147,198,.45)}
.slots.done i.on{background:var(--good);box-shadow:0 0 10px rgba(30,158,87,.35)}
.cons .nums div{background:var(--soft);border-radius:14px}
.cons .nums b{font-family:var(--serif);font-weight:400;font-size:30px}
.heat i{background:var(--soft)}
.heat i.l1{background:#e2f2f9;color:var(--ink)} .heat i.l2{background:#9fd5ea;color:var(--ink)}
.heat i.hit{background:var(--grad);color:#fff}
.heat i.today{outline-color:var(--ink)}
.heat i.future{background:none}
.next-call{border-radius:14px;background:var(--soft);border-color:transparent}

/* steps */
.steps div{border-top-color:var(--soft)}
.steps div.on,.steps div.past{border-top-color:var(--accent)}
.steps div.on{color:var(--ink)}
.drop{border:1.5px dashed #d8d8d8;border-radius:16px;background:var(--soft)}
.drop:hover{border-color:var(--accent)}
.drop.over,.dm.over{border-color:var(--accent);background:#eef8fc}

/* stats */
.stat{border-radius:18px;background:var(--soft);border-color:transparent}
.stat b{font-family:var(--serif);font-weight:400;font-size:34px;line-height:1.1;letter-spacing:-.01em}
.stat.hero{background:linear-gradient(135deg,#e6f5fb,#fbe9f3);border-color:transparent}
.score .big-n{font-family:var(--serif);font-weight:400;font-size:64px}

/* properties (Notion-style tags) */
.pill{border-radius:6px;font-weight:600;font-size:11px;padding:2px 8px;background:var(--soft);color:var(--muted)}
.pill.good{background:#e6f6ec;color:var(--good)} .pill.solid{background:var(--good);color:#fff}
.pill.fu{background:var(--fu);color:#fff} .pill.fu-soft{background:#fbe6f1;color:var(--fu)} .pill.bad{background:#fbe9e9;color:var(--bad)}
.crit i b{background:var(--grad)}
.dm,.lead,.rank,.fuitem,.call{border-bottom-color:var(--line)}
.dm a,.lead .who a{color:var(--ink)}
.rank .pos{font-family:var(--serif);font-weight:400;font-size:28px}
th{color:var(--muted)}
.dm pre,.fuitem pre{background:var(--soft);border-radius:12px}

/* stage views (Notion-style) */
.views{display:flex;gap:6px;flex-wrap:wrap}
.views button{font-size:13px;padding:6px 12px;background:#fff}
.views button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.views button b{font-weight:600;margin-left:4px;opacity:.7}

/* incentive strip on To contact */
.potential{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:14px 16px;border-radius:18px;background:linear-gradient(120deg,#e3f3fa,#f9e6f1)}
.potential b{font-family:var(--serif);font-weight:400;font-size:30px;line-height:1;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.potential span{font-size:12px;color:#40506a}

/* celebration */
/* calm layout: sections, tiles, rows */
.subnav{display:flex;gap:2px;background:var(--soft);border-radius:999px;padding:4px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 57px);z-index:4}
.subnav button{flex:1;border:0;background:none;border-radius:999px;padding:8px 6px;font-size:13px;font-weight:500;color:var(--muted);white-space:nowrap}
.subnav button:hover{transform:none;color:var(--ink)}
.subnav button.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.subnav .count{display:inline-block;min-width:16px;margin-left:5px;padding:0 4px;border-radius:999px;background:var(--pink);color:#fff;font-size:10px;font-weight:700;line-height:16px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:6px}
.sec-h h2{margin:0}
.glance{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{display:grid;gap:2px;text-align:left;border-radius:18px;background:var(--soft);border:1px solid transparent;padding:14px 16px;align-content:start;min-width:0}
.tile:hover{border-color:var(--line);transform:translateY(-1px)}
.tile span{font-size:12px;color:var(--muted)}
.tile b{font-family:var(--serif);font-weight:400;font-size:28px;line-height:1.1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile small{font-size:12px;color:var(--muted)}
.grad-text{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.dm{padding:14px 16px}
.dm-main{display:flex;align-items:center;gap:10px}
.dm-main .who{flex:1;min-width:0}
.dm-main .who a{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.more{margin-top:6px}
.more summary{list-style:none;display:inline-block;cursor:pointer;font-size:12px;color:var(--muted);padding:2px 0}
.more summary::-webkit-details-marker{display:none}
.more summary::after{content:' ▾'}
.more[open] summary::after{content:' ▴'}
.stats{grid-template-columns:repeat(2,1fr)}
@media (max-width:420px){ .dm-main{flex-wrap:wrap} .dm-main .who{flex-basis:100%} .glance .tile b{font-size:24px} }
/* board (GHL-style pipeline) */
.filters{display:grid;gap:8px}
.board-wrap{width:min(1640px,calc(100vw - 48px));margin-left:calc(50% - min(820px, 50vw - 24px))}
.board{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;align-items:start}
@media (max-width:1100px){ .board{grid-template-columns:repeat(3,minmax(0,1fr))} }
@media (max-width:760px){ .board-wrap{width:auto;margin-left:0} .board{grid-template-columns:1fr} }
.col{background:var(--soft);border-radius:18px;padding:10px;display:grid;gap:8px;align-content:start;scroll-snap-align:start;min-height:140px;transition:box-shadow .2s,background .2s}
.col.over{background:#eef8fc;box-shadow:0 0 0 2px var(--accent) inset}
.col-h{display:grid;gap:2px;padding:2px 4px 6px}
.col-h .t{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;min-width:0}
.col-h .t i{width:9px;height:9px;border-radius:50%;flex:none}
.col-h .t b{margin-left:auto;font-weight:600;font-size:12px;color:var(--muted)}
.col-h small{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.kcard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:grid;gap:6px;cursor:grab;transition:transform .15s,box-shadow .2s}
.kcard:hover{box-shadow:0 6px 18px -10px rgba(0,0,0,.25)}
.kcard.dragging{opacity:.45;transform:rotate(-2deg)}
.kcard a{color:var(--ink);font-weight:600;text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kcard .meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:11px;color:var(--muted)}
.kcard select{font:inherit;font-size:12px;color:var(--muted);background:var(--soft);border:0;border-radius:8px;padding:4px 6px;width:100%;cursor:pointer}
.col-empty{font-size:12px;color:var(--muted);text-align:center;padding:14px 6px;border:1.5px dashed #dcdcdc;border-radius:12px}
.kcard .book{margin-top:0}
.kcard .book input{width:100%}
/* pipeline money stack */
.pipe{display:grid;gap:14px}
.pipe .total{font-family:var(--serif);font-weight:400;font-size:52px;line-height:1;letter-spacing:-.02em;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.pipe .total small{font-family:Inter,system-ui,sans-serif;font-size:14px;-webkit-text-fill-color:var(--muted);color:var(--muted);letter-spacing:0}
.stack{display:flex;height:14px;border-radius:999px;overflow:hidden;background:var(--soft);gap:2px}
.stack i{display:block;height:100%;min-width:4px;transition:flex-grow .6s cubic-bezier(.2,.7,.3,1)}
.pipe .rows{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pipe .rows.r5{grid-template-columns:repeat(5,1fr)}
@media (max-width:560px){ .pipe .rows.r5{grid-template-columns:repeat(3,1fr)} }
.pipe .rows div{display:grid;gap:2px;min-width:0}
.pipe .rows span{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px}
.pipe .rows span i{width:8px;height:8px;border-radius:2px;flex:none}
.pipe .rows b{font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap}
.pipe .rows em{font-style:normal;font-size:11px;color:var(--muted)}
@media (max-width:420px){ .pipe .rows{grid-template-columns:1fr 1fr} }
.spark.p{color:var(--pink);text-shadow:0 0 8px rgba(216,57,149,.6)}
.spark{position:fixed;z-index:60;pointer-events:none;font-size:14px;color:var(--accent);text-shadow:0 0 8px rgba(5,147,198,.6);animation:spark .9s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes spark{0%{opacity:1;transform:translate(0,0) scale(.4) rotate(0)}70%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.1) rotate(160deg)}}
.confetti{position:fixed;top:-12px;z-index:60;width:8px;height:12px;border-radius:2px;pointer-events:none;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translate(var(--dx),105vh) rotate(var(--rot));opacity:.9}}
.pop{animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}
.toast{background:var(--ink);color:#fff;border:0;border-radius:999px;padding:10px 18px;box-shadow:0 10px 30px -10px rgba(0,0,0,.35)}

@media (prefers-reduced-motion:reduce){
  .toast{transition:none}
  .big.primary,.primary.go::before,.spark,.confetti,.pop{animation:none!important}
  .spark,.confetti{display:none}
  button,.btnlike{transition:none}
}
</style>
</head>
<body>
<header><div class="in">
  <h1>Outreach <i>CRM</i></h1>
  <nav>
    <button data-tab="start">Start</button>
    <button data-tab="leads">To contact<span id="leadCount"></span></button>
    <button data-tab="track">Tracking<span id="fuCount"></span></button>
  </nav>
</div></header>

<main>
  <section id="start">
    <div class="card goal" id="goal"></div>
    <div id="flow"></div>
    <div class="glance" id="glance"></div>
    <div class="card cons" id="cons"></div>
  </section>
  <section id="leads" hidden></section>
  <section id="track" hidden></section>
</main>
<div class="toast" id="toast"></div>

<script>
/* Each DM is one document in "dms", keyed by IG handle:
   { handle, url, followers, avgLikes, avgComments, er, channel, shotId, opener (read from the screenshot), loom,
     sentAt, day, status: sent|replied|booked|later|lost, followUpOn (for later), repliedAt, bookedFor, seen, followedUpAt, reply:{text, sentiment},
     followUps:[{at, text, loom, shotId}], offer: accelerator, lostAt (status lost = not interested),
     score:{overall, criteria:{human, personal, value, lowNo, status, clarity, loom}, style, feedback} } */
const GOAL = 5, FOLLOW_UP_AFTER = 3, TOO_LATE = 7, DAY = 864e5;

let store = null, sample = null, assets = null, canImages = false, dms = [], loaded = false;
const CHANNELS = ['Instagram','WhatsApp','Email'];
// What each prospect is being pitched. Prices are per month.
const OFFERS = {
  accelerator: { name:'Accelerator', price:5000, note:'' },
};
const eur = n => Math.round(n).toLocaleString('de-DE') + '€';
const offerOf = d => OFFERS[d?.offer] ? d.offer : 'accelerator'; // the Accelerator is the only offer
// Distilled from David's sales-training notes. Every DM is scored against these.
const CRITERIA = [
  ['human',    'Human, not automated'],
  ['personal', 'Personal & specific'],
  ['value',    'Value first'],
  ['lowNo',    'Easy to say yes'],
  ['status',   'Status & conviction'],
  ['clarity',  'Short & clear'],
  ['loom',     'Loom quality'],
];
const RUBRIC = `Score against these outreach principles, 1-10 each:
- human: reads like a real person wrote it for this one prospect, not a template or automation. A personal video (the Loom) puts a face to the name; people don't like letting a real person down.
- personal: references something real and specific about the prospect (their content, offer, numbers, situation). Nobody cares how much you know until they know how much you care.
- value: gives something useful up front (an observation, idea, quick win, relevant asset). Never selfish asks like "got a minute?" or "just checking in".
- lowNo: reduces the odds of a no. Ends with an open-ended question or 2-3 easy options (reply here, quick call now or later, watch the video) instead of a single yes/no ask.
- status: talks peer to peer with calm certainty and authority. No begging, over-thanking, desperation or over-availability: wants the deal, doesn't need it. Uses the vocabulary of the prospect's world; nothing that reads as cheap, hypey or salesy. No income claims.
- clarity: short, readable in about 10 seconds, one clear point, clear next step.
- loom: strong open (who, why them, what they'll get in the first seconds); diagnoses current state vs desired state and the pain, problem and pressure; explains features as advantage -> benefit tied to an emotion (confidence, relief, competence, savvy, acceptance, creativity); concise, no fluff; ends with one easy next step. Score 1 if there is no transcript.`;
const clamp10 = v => Math.max(1, Math.min(10, Math.round(+v || 0))) || null;
function critHTML(sc){
  if(!sc?.criteria) return '';
  return `<div class="crit">${CRITERIA.map(([k,l]) => sc.criteria[k] ? `<div>${l}<i><b style="width:${sc.criteria[k]*10}%"></b></i><span>${sc.criteria[k]}</span></div>` : '').join('')}</div>`;
}
function readReply(r){
  const rp = r && r.reply;
  if(!rp || !rp.replied) return null;
  return { text:String(rp.text || '').slice(0,1000), sentiment:['positive','neutral','negative'].includes(rp.sentiment) ? rp.sentiment : 'neutral', booked:!!rp.booked };
}
let tab = 'start';
let flow = null;          // null = not started; else { step, d:{...}, result }

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pct = (a,b) => b ? Math.round(1000*a/b)/10 + '%' : '—';
const num = v => { const n = parseFloat(String(v ?? '').replace(/[, ]/g,'').replace(/k$/i,'e3').replace(/m$/i,'e6')); return isFinite(n) ? n : null; };
const localDay = (d = new Date()) => d.toLocaleDateString('en-CA');
const daysSince = iso => Math.floor((Date.now() - new Date(iso)) / DAY);
// Small bursts of yellow sparkles from an element; a confetti rain for the big moments.
function sparkle(el, n = 14){
  if(!el || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const r = el.getBoundingClientRect(), cx = r.left + r.width/2, cy = r.top + r.height/2;
  for(let i = 0; i < n; i++){
    const s = document.createElement('span'), a = Math.random()*Math.PI*2, d = 40 + Math.random()*60;
    s.className = 'spark' + (i % 2 ? ' p' : ''); s.textContent = Math.random() < .7 ? '✦' : '✧';
    s.style.left = cx + 'px'; s.style.top = cy + 'px'; s.style.fontSize = (10 + Math.random()*10) + 'px';
    s.style.setProperty('--dx', Math.cos(a)*d + 'px'); s.style.setProperty('--dy', Math.sin(a)*d + 'px');
    document.body.appendChild(s); setTimeout(() => s.remove(), 950);
  }
}
function confetti(n = 70){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const colors = ['#0593c6','#d83995','#4a78cf','#9fd5ea','#f3a6cf','#151515'];
  for(let i = 0; i < n; i++){
    const c = document.createElement('span');
    c.className = 'confetti'; c.style.left = Math.random()*100 + 'vw'; c.style.background = colors[i % colors.length];
    c.style.setProperty('--dx', (Math.random()*160 - 80) + 'px'); c.style.setProperty('--rot', (Math.random()*720 - 360) + 'deg');
    c.style.animationDelay = Math.random()*.35 + 's'; c.style.animationDuration = 1.4 + Math.random()*1 + 's';
    document.body.appendChild(c); setTimeout(() => c.remove(), 3000);
  }
}
const bump = el => { if(!el) return; el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); };
let lastToday = null; // DMs today at the last render, to celebrate the moment the goal is hit

function toast(t){ const el=$('#toast'); el.textContent=t; el.classList.add('show'); clearTimeout(toast.t); toast.t=setTimeout(()=>el.classList.remove('show'),2200); }

// Profile links are plain links so the Claude viewer opens them itself, outside the page's sandbox.
const igUrl = h => `https://www.instagram.com/${encodeURIComponent(h)}/`;
async function copyText(t){
  try{ await navigator.clipboard.writeText(t); return true; }
  catch(e){
    const ta = document.createElement('textarea'); ta.value = t; ta.style.cssText = 'position:fixed;opacity:0'; document.body.appendChild(ta); ta.select();
    let ok = false; try{ ok = document.execCommand('copy'); }catch(_){} ta.remove(); return ok;
  }
}

// Audience engagement, measured by Claude from the profile's recent reels (stored on the lead as "engagement").
const compact = n => n == null ? '' : Intl.NumberFormat('en', { notation:'compact', maximumFractionDigits:1 }).format(n);
function engPill(x){
  const e = x?.engagement; if(!e?.score) return '';
  const cls = e.score >= 8 ? 'good' : e.score >= 5 ? 'fu-soft' : 'bad';
  return `<span class="pill ${cls}" title="Engagement rate ${(e.er*100).toFixed(2)}% · reach ${(e.viewRate*100).toFixed(1)}% · ${compact(e.avgPlays)} avg plays">Engagement ${e.score}/10 · ${e.label}</span>`;
}

function parseHandle(raw){
  raw = (raw || '').trim();
  const m = raw.match(/instagram\.com\/([A-Za-z0-9._]+)/i);
  const h = (m ? m[1] : raw.replace(/^@/,'')).replace(/\/$/,'').toLowerCase();
  return /^[a-z0-9._]{1,30}$/.test(h) && !['p','reel','reels','stories','explore'].includes(h) ? h : null;
}
function engagement(d){
  const f = num(d.followers), l = num(d.avgLikes) || 0, c = num(d.avgComments) || 0;
  if(!f || (!l && !c)) return null;
  return (l + c) / f;
}
function tier(er){
  if(er == null) return null;
  return er >= .03 ? 'High' : er >= .01 ? 'Medium' : 'Low';
}
const fmtCall = iso => new Date(iso).toLocaleString(undefined, { weekday:'short', day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' });
const upcomingCalls = () => dms.filter(d => d.status === 'booked' && d.bookedFor && new Date(d.bookedFor) > Date.now() - 2*3600e3)
  .sort((a,b) => a.bookedFor.localeCompare(b.bookedFor));
const STAGES = [['all','All'],['sent','Contacted'],['replied','Responded'],['booked','Booked call'],['later','In 30 days'],['lost','Not interested']];
// Board columns, in pipeline order. "lead" is a queued profile; the rest are DM statuses.
const COLS = [
  { k:'lead',    label:'Lead',           color:'#cfe8f3' },
  { k:'sent',    label:'Contacted',      color:'#7cc3e0' },
  { k:'replied', label:'Responded',      color:'#0593c6' },
  { k:'booked',  label:'Booked Call',    color:'#d83995' },
  { k:'later',   label:'Follow up in 30 days', color:'#f3a6cf' },
  { k:'lost',    label:'Not Interested', color:'#b9b9b9' },
];
// Someone counts as having responded if they replied at any point, even if they later said no.
const responded = d => ['replied','booked'].includes(d.status) || (['lost','later'].includes(d.status) && !!d.repliedAt);
let stage = 'all';   // which stage the All DMs list shows
let booking = null; // handle whose booking form is open
let leads = [];      // profiles waiting for a first DM (collection "leads", keyed by handle)
let fuFlow = null;  // follow-up being logged: { handle, step, shot, shotUrl, loom, saving }
// Every logged follow-up, oldest first. Older DMs only have followedUpAt, so count that as one.
const followUpsOf = d => d.followUps?.length ? d.followUps : d.followedUpAt ? [{ at:d.followedUpAt, text:'', legacy:true }] : [];
// Where a DM stands on follow-up: none needed, waiting, due, too late.
function followState(d){
  if(d.status === 'later'){
    const on = d.followUpOn ? new Date(d.followUpOn) : null;
    if(!on) return null;
    return on <= Date.now() ? { k:'due', label:'30-day follow-up due' } : { k:'wait', label:`Follow up ${on.toLocaleDateString(undefined,{month:'short',day:'numeric'})}` };
  }
  if(d.status !== 'sent') return null;
  if(d.followedUpAt) return { k:'done', label:'Followed up' };
  const days = daysSince(d.sentAt);
  if(days >= TOO_LATE) return { k:'late', label:'Too late', days };
  if(days >= FOLLOW_UP_AFTER) return { k:'due', label:`Follow up · ${TOO_LATE-days}d left`, days };
  return { k:'wait', label:`Follow up in ${FOLLOW_UP_AFTER-days}d`, days };
}

/* ---------- Start screen ---------- */
// Count of DMs per local day, e.g. { "2026-10-09": 5 }.
function dayCounts(){
  const c = {};
  for(const d of dms) if(d.day) c[d.day] = (c[d.day] || 0) + 1;
  return c;
}
const addDays = (dt, n) => { const x = new Date(dt); x.setDate(x.getDate() + n); return x; };

// Streaks count days where the goal was hit. Today only breaks the streak once it's over.
function consistency(counts){
  const today = new Date();
  let streak = 0;
  for(let i = (counts[localDay(today)] || 0) >= GOAL ? 0 : 1; ; i++){
    if((counts[localDay(addDays(today, -i))] || 0) >= GOAL) streak++; else break;
  }
  const days = Object.keys(counts).sort();
  let best = 0, run = 0, prev = null;
  for(const k of days){
    if(counts[k] < GOAL){ run = 0; prev = k; continue; }
    run = prev && localDay(addDays(new Date(prev + 'T12:00'), 1)) === k && counts[prev] >= GOAL ? run + 1 : 1;
    best = Math.max(best, run); prev = k;
  }
  // Hit rate over the last 30 days, counted from the first day you logged a DM.
  const first = days[0];
  let span = 0, hits = 0;
  for(let i = 0; i < 30; i++){
    const k = localDay(addDays(today, -i));
    if(!first || k < first) break;
    if(i === 0 && (counts[k] || 0) < GOAL) continue; // today isn't over yet
    span++; if((counts[k] || 0) >= GOAL) hits++;
  }
  return { streak, best: Math.max(best, streak), hits, span };
}

function renderGoal(){
  const counts = dayCounts();
  const today = new Date(), todayKey = localDay(today);
  const n = counts[todayKey] || 0;
  const c = consistency(counts);
  const grew = lastToday !== null && n > lastToday, hit = lastToday !== null && lastToday < GOAL && n >= GOAL;
  lastToday = n;

  // Last 5 weeks, Monday-first, so each column is a weekday.
  const start = addDays(today, -((today.getDay() + 6) % 7) - 28);
  const cells = [];
  for(let i = 0; i < 35; i++){
    const dt = addDays(start, i), k = localDay(dt), v = counts[k] || 0;
    const future = k > todayKey;
    const cls = future ? 'future' : v >= GOAL ? 'hit' : v >= 3 ? 'l2' : v ? 'l1' : '';
    cells.push(`<i class="${cls} ${k === todayKey ? 'today' : ''}" title="${dt.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'})}: ${v} DM${v===1?'':'s'}">${future ? '' : v || ''}</i>`);
  }
  const dows = ['M','T','W','T','F','S','S'].map(d => `<i class="dow">${d}</i>`).join('');

  $('#goal').innerHTML = `
    <div class="row" style="justify-content:space-between;align-items:flex-end">
      <div><div class="small muted">Today · ${today.toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric'})}</div><div class="n">${n}<small> / ${GOAL}</small></div></div>
      <div class="small ${n>=GOAL?'':'muted'}" style="${n>=GOAL?'color:var(--good);font-weight:600':''}">${n>=GOAL ? 'Goal hit ✦' : n ? `${GOAL-n} to go. Keep the streak alive` : `${GOAL} to go`}</div>
    </div>
    <div class="slots ${n>=GOAL?'done':''}">${Array.from({length:GOAL},(_,i)=>`<i class="${i<n?'on':''}"></i>`).join('')}</div>
    <div class="small muted">Daily goal ${GOAL} DMs · resets at midnight</div>`;
  const nc = upcomingCalls()[0];
  $('#glance').innerHTML = `
    <button class="tile" data-tab="track" data-sub="pipeline"><span>Pipeline</span><b class="grad-text">${eur(pipeline().total)}</b><small>per month potential</small></button>
    <button class="tile" data-tab="track" data-sub="pipeline"><span>Next call</span>${nc ? `<b>@${esc(nc.handle)}</b><small>${esc(fmtCall(nc.bookedFor))}</small>` : `<b class="muted">None yet</b><small>Book one from Tracking</small>`}</button>`;
  $('#cons').innerHTML = `
      <h2 style="margin:0"><i>Consistency</i></h2>
      <div class="nums">
        <div><b>${c.streak}<span style="font-size:13px"> day${c.streak===1?'':'s'}</span></b><span>Current streak</span></div>
        <div><b>${c.best}</b><span>Best streak</span></div>
        <div><b>${c.span ? Math.round(100*c.hits/c.span)+'%' : '—'}</b><span>Goal hit, last 30 days</span></div>
      </div>
      ${n < GOAL && c.streak ? `<div class="small muted">Send ${GOAL-n} more today to keep your ${c.streak}-day streak.</div>` : ''}
      <div class="heat">${dows}${cells.join('')}</div>
      <div class="legend"><span><i style="background:var(--soft)"></i>0</span><span><i style="background:#e2f2f9"></i>1–2</span><span><i style="background:#9fd5ea"></i>3–4</span><span><i style="background:var(--grad)"></i>${GOAL}+ goal hit</span></div>`;
  if(grew) bump($('#goal .n'));
  if(hit){ confetti(); setTimeout(() => toast(`${GOAL} DMs today. Goal hit ✦`), 300); }
}

function renderFlow(){
  const el = $('#flow');
  if(!store){ el.innerHTML = `<div class="notice">${loaded ? 'Open this page in Claude to log DMs.' : 'Connecting…'}</div>`; return; }
  if(!flow){
    const next = pendingLeads()[0];
    el.innerHTML = `<div style="display:grid;gap:8px"><button class="primary big go" data-act="start">Start outreach<span class="arrow">↗</span></button>
      <div class="next-up">${next ? `Next up: <b style="color:var(--ink)">@${esc(next.handle)}</b> · ${pendingLeads().length} pending to contact` : 'No profiles waiting. Add some in <b>To contact</b>, or enter a link yourself.'}</div></div>`;
    return;
  }
  if(flow.result) return renderResult();
  const d = flow.d, s = flow.step;
  const labels = ['Account','Message','Loom'];
  let body = '';
  if(s === 0){
    const er = engagement(d), t = tier(er);
    body = `
      <label class="f">Instagram profile link<input id="f_url" value="${esc(d.url)}" placeholder="https://instagram.com/username" autocomplete="off"></label>

      <div class="small muted">Profile engagement (check their last 3 posts)</div>
      <div class="grid3">
        <label class="f">Followers<input id="f_followers" inputmode="decimal" value="${esc(d.followers)}" placeholder="12.4k"></label>
        <label class="f">Avg likes<input id="f_avgLikes" inputmode="decimal" value="${esc(d.avgLikes)}" placeholder="350"></label>
        <label class="f">Avg comments<input id="f_avgComments" inputmode="decimal" value="${esc(d.avgComments)}" placeholder="20"></label>
      </div>
      <div class="er" id="erOut">${er==null ? 'Engagement rate appears here.' : `Engagement rate <b>${(er*100).toFixed(1)}%</b> · ${t}`}</div>`;
  } else if(s === 1){
    body = `
      <div class="small muted">Sent via</div>
      <div class="seg">${CHANNELS.map(c => `<button class="${d.channel===c?'on':''}" data-act="channel" data-c="${c}">${c}</button>`).join('')}</div>
      <div class="small muted">Screenshot of your message</div>
      <label class="drop" for="f_shot" data-drop="flow">${d.shotUrl ? `<img src="${d.shotUrl}" alt="Message screenshot">` : 'Drag & drop the screenshot here<br>or tap to choose'}<input type="file" id="f_shot" accept="image/*" hidden></label>
      ${d.shotUrl ? `<button class="sm" data-act="noshot" style="justify-self:start">Remove screenshot</button>` : ''}`;
  } else {
    body = `<label class="f">Loom transcript<textarea id="f_loom" rows="9" placeholder="Paste the Loom transcript here">${esc(d.loom)}</textarea></label>`;

async function scoreDM(doc, shot){
  if(!sample || !shot || !canImages) return null;
  const prompt = `You score cold outreach for an agency owner. Each DM is sent via ${doc.channel} with a personalised Loom video. The attached screenshot shows the conversation.

Prospect: @${doc.handle}. Followers: ${doc.followers ?? 'unknown'}. Avg likes: ${doc.avgLikes ?? 'unknown'}. Avg comments: ${doc.avgComments ?? 'unknown'}. Engagement rate: ${doc.er != null ? (doc.er*100).toFixed(2)+'%' : 'unknown'}. Weigh how hard this prospect is to reach given their audience size and engagement.

${RUBRIC}

Loom transcript:
"""${(doc.loom || '(none)').slice(0, 12000)}"""

Also check the screenshot for a reply: any message from the prospect after the sender's opener.

Reply with only JSON:
{"openerText": "the sender's opener, word for word", "criteria": {"human":1-10,"personal":1-10,"value":1-10,"lowNo":1-10,"status":1-10,"clarity":1-10,"loom":1-10}, "overall": 1-10, "style": "2-4 word label for the opener's approach", "feedback": "the single most important change for next time, one sentence", "reply": {"replied": true|false, "text": "the prospect's reply, word for word", "sentiment": "positive|neutral|negative", "booked": true|false}}`;
  const r = await sample.json(prompt, { modelTier:'default', images:[shot] });
  if(!r || !clamp10(r.overall)) return null;
  const criteria = {};
  for(const [k] of CRITERIA) criteria[k] = clamp10(r.criteria?.[k]);
  return {
    openerText:String(r.openerText || '').slice(0,4000),
    score:{ overall:clamp10(r.overall), criteria, style:String(r.style || 'Unlabelled').slice(0,40), feedback:String(r.feedback || '').slice(0,300) },
    reply:readReply(r)
  };
}

// A newer screenshot of the thread: Claude checks it for a reply and updates the DM.
async function checkReply(handle, file){
  if(!file || !file.type.startsWith('image/')) return;
  if(!sample || !canImages){ toast("Claude can't read screenshots here. Mark it by hand."); return; }
  const d = dms.find(x => x.handle === handle); if(!d) return;
  toast(`Checking @${handle} for a reply…`);
  try{
    const r = await sample.json(`This is a screenshot of a ${d.channel || 'Instagram'} conversation. The sender's first message was: """${(d.opener || '').slice(0,2000)}"""
Is there any message from the prospect (the other person) after the sender's messages? Did they agree to a call?
Reply with only JSON: {"reply": {"replied": true|false, "text": "their latest reply, word for word", "sentiment": "positive|neutral|negative", "booked": true|false}}`, { modelTier:'quick', images:[file] });
    const reply = readReply(r);
    const patch = {};
    if(assets){ try{ const a = await assets.upload(file); patch.replyShotId = a.id; patch.replyShotUrl = a.url; }catch(e){} }
    if(reply){
      Object.assign(patch, { status: reply.booked ? 'booked' : 'replied', repliedAt: d.repliedAt || new Date().toISOString(), reply:{ text:reply.text, sentiment:reply.sentiment } });
    }
    if(Object.keys(patch).length) await store.collection('dms').doc(handle).update(patch);
    toast(reply ? (reply.booked ? `@${handle} booked a call` : `@${handle} replied`) : `No reply from @${handle} in that screenshot`);
  }catch(e){ toast("Couldn't read that screenshot. Try again."); }
}

async function save(){
  readStep();
  const d = flow.d, handle = parseHandle(d.url);
  if(!handle){ flow.step = 0; renderFlow(); toast('Add a valid Instagram profile link'); return; }
  if(!d.shot){ flow.step = 1; renderFlow(); toast('Drop in the screenshot of your message'); return; }
  const existing = dms.find(x => x.handle === handle);
  if(existing){ toast(`@${handle} is already logged (${new Date(existing.sentAt).toLocaleDateString()})`); return; }
  const er = engagement(d);
  const doc = {
    handle, url:`https://instagram.com/${handle}`,
    followers:num(d.followers), avgLikes:num(d.avgLikes), avgComments:num(d.avgComments), er,
    channel:d.channel || 'Instagram', offer:d.offer || 'accelerator', opener:'', loom:d.loom.trim(),
    sentAt:new Date().toISOString(), day:localDay(), status:'sent'
  };
  const fromLead = leads.find(l => l.handle === handle);
  if(fromLead?.engagement) doc.engagement = fromLead.engagement;
  flow.saving = true; renderFlow();
  const shot = d.shot;
  if(shot && assets){
    try{ const a = await assets.upload(shot); doc.shotId = a.id; doc.shotUrl = a.url; }
    catch(e){ toast("Screenshot couldn't be stored. Saving the rest."); }
  }
  try{
    await store.collection('dms').doc(handle).set(doc);
    if(leads.some(l => l.handle === handle)) store.collection('leads').doc(handle).delete().catch(() => {});
  }
  catch(e){ flow.saving = false; renderFlow(); toast("Couldn't save. Check your connection and try again."); return; }
  try{ localStorage.removeItem('outreach-draft'); }catch(e){}
  flow = { result:{ handle }, scoring:!!(sample && canImages) };
  renderResult();
  sparkle($('#flow .card'), 22);
  if(!flow.scoring) return;
  try{
    const res = await scoreDM(doc, shot);
    if(res){
      const patch = { score:res.score, opener:res.openerText };
      if(res.reply) Object.assign(patch, { status: res.reply.booked ? 'booked' : 'replied', repliedAt:new Date().toISOString(), reply:{ text:res.reply.text, sentiment:res.reply.sentiment } });
      await store.collection('dms').doc(handle).update(patch);
    }
    if(flow && flow.result && flow.result.handle === handle){ Object.assign(flow.result, res ? { score:res.score, reply:res.reply } : {}); flow.scoring = false; renderResult(); }
  }catch(e){
    if(flow && flow.result && flow.result.handle === handle){ flow.scoring = false; renderResult(); }
  }
}

  </table></div>`;
}
function group(keyFn, order){
  const g = {};
  for(const d of dms){
    const k = keyFn(d); if(k == null) continue;
    const r = g[k] ||= { label:k, sent:0, replies:0 };
    r.sent++; if(responded(d)) r.replies++;
  }
  const rows = Object.values(g);
  return order ? order.map(k => g[k]).filter(Boolean) : rows.sort((a,b) => b.sent - a.sent);
}

// Every euro in play, per month: queued profiles plus every DM by stage, priced by its offer.
const PIPE_STAGES = [
  { k:'queue',   label:'To contact', color:'#cfe8f3' },
  { k:'sent',    label:'Waiting',    color:'#7cc3e0' },
  { k:'replied', label:'Replied',    color:'#0593c6' },
  { k:'later',   label:'In 30 days', color:'#f3a6cf' },
  { k:'booked',  label:'Booked',     color:'#d83995' },
];
function pipeline(){
  const price = x => OFFERS[offerOf(x)].price;
  const groups = { queue:pendingLeads(), sent:dms.filter(d => d.status === 'sent'), replied:dms.filter(d => d.status === 'replied'), later:dms.filter(d => d.status === 'later'), booked:dms.filter(d => d.status === 'booked') };
  const rows = PIPE_STAGES.map(st => ({ ...st, n:groups[st.k].length, value:groups[st.k].reduce((t,x) => t + price(x), 0) }));
  return { rows, total:rows.reduce((t,r) => t + r.value, 0) };
}
function pipelineCard(){

// Move a lead or DM to a board column. A queued lead becomes a DM the moment it leaves "Lead".
async function moveTo(kind, h, col){
  const now = new Date().toISOString();
  if(kind === 'dm' && col === 'lead'){ toast(`@${h} already has a logged DM, so it can't go back to Lead`); return false; }
  try{
    if(kind === 'lead'){
      if(col === 'lead') return false;
      const l = leads.find(x => x.handle === h); if(!l) return false;
      const lastCh = dms.slice().sort((a,b) => b.sentAt.localeCompare(a.sentAt))[0]?.channel;
      const doc = { handle:h, url:`https://instagram.com/${h}`, offer:offerOf(l), channel:lastCh || 'Instagram', opener:'', loom:'', sentAt:now, day:localDay(), status:col, movedOnBoard:true };
      if(col === 'replied' || col === 'booked') doc.repliedAt = now;
      if(col === 'lost') doc.lostAt = now;
      if(col === 'later') doc.followUpOn = new Date(Date.now() + 30*DAY).toISOString();
      await store.collection('dms').doc(h).set(doc);
      store.collection('leads').doc(h).delete().catch(() => {});
    } else {
      const d = dms.find(x => x.handle === h); if(!d || d.status === col) return false;
      const patch = { status:col };
      if((col === 'replied' || col === 'booked') && !d.repliedAt) patch.repliedAt = now;
      if(col === 'lost') patch.lostAt = now;
      if(col === 'later') patch.followUpOn = new Date(Date.now() + 30*DAY).toISOString();
      await store.collection('dms').doc(h).update(patch);
    }
  }catch(e){ toast("Couldn't move. Try again."); return false; }
  const label = COLS.find(c => c.k === col).label;
  if(col === 'booked'){ toast(`@${h} → Booked Call ✦ Set the call time on the card`); booking = h; confetti(40); }
  else if(col === 'later') toast(`@${h} → follow up on ${new Date(Date.now() + 30*DAY).toLocaleDateString(undefined,{month:'short',day:'numeric'})}`);
  else toast(`@${h} → ${label}`);
  return true;
}

// Rank every opener by what it got: booked, then a warm reply, then any reply, then seen, then nothing.
function outcome(d){
  if(d.status === 'booked') return { pts:4, label:'Booked', cls:'solid' };
  if(d.status === 'replied'){
    const s = d.reply?.sentiment;
    return s === 'positive' ? { pts:3, label:'Warm reply', cls:'good' } : s === 'negative' ? { pts:1, label:'Cold reply', cls:'bad' } : { pts:2, label:'Replied', cls:'good' };
  }
  if(d.status === 'lost') return { pts: d.repliedAt ? 1 : 0, label:'Not interested', cls:'bad' };
  if(d.status === 'later') return { pts: d.repliedAt ? 2 : 0.5, label:'In 30 days', cls:'fu-soft' };
  if(d.seen) return { pts:0.5, label:'Seen', cls:'' };
  return { pts:0, label:'No reply', cls:'' };
}
function openerRanking(){
  const rows = dms.filter(d => d.opener).map(d => ({ d, o:outcome(d) }))
    .sort((a,b) => b.o.pts - a.o.pts || (b.d.score?.overall || 0) - (a.d.score?.overall || 0) || a.d.sentAt.localeCompare(b.d.sentAt));
  if(!rows.length) return `<div class="card empty small">Openers show up here once Claude has read your screenshots.</div>`;
  return `<div class="card list">${rows.map(({d,o},i) => `<div class="rank">
      <span class="pos">${i+1}</span>
      <div style="min-width:0;flex:1">
        <div class="txt">${esc(d.opener.replace(/https?:\/\/\S+/g,'[Loom]'))}</div>

      <span class="pill ${o.cls}">${o.label}</span>

}

async function addLeads(text){
  const c = contacted(), have = new Set(leads.map(l => l.handle)), seen = new Set();
  let added = 0, skipped = 0, bad = 0;
  const now = new Date().toISOString();
  // Each line: any instagram.com links or @handles in it, or a lone username.
  const found = [];
  for(const line of text.split(/[\n,;]+/)){
    const t = line.trim(); if(!t) continue;
    const hits = [...t.matchAll(/instagram\.com\/[A-Za-z0-9._]+|@[A-Za-z0-9._]+/gi)].map(m => m[0]);
    const cands = hits.length ? hits : (/\s/.test(t) ? [] : [t]);
    if(!cands.length){ bad++; continue; }
    found.push(...cands);
  }
  for(const raw of found){
    const h = parseHandle(raw);
    if(!h){ bad++; continue; }
    if(c.has(h) || have.has(h) || seen.has(h)){ skipped++; continue; }
    seen.add(h);
    try{ await store.collection('leads').doc(h).set({ handle:h, url:`https://instagram.com/${h}`, addedAt:now, offer:'accelerator' }); added++; }
    catch(e){ toast("Couldn't save. Try again."); return; }
  }
  const box = $('#leadPaste'); if(box) box.value = '';
  renderLeads();
  if(added){ sparkle($('[data-act=leadadd]'), 18); bump($('#leadCount')); }
  toast(`Added ${added}` + (skipped ? ` · ${skipped} already in your list or DMed` : '') + (bad ? ` · ${bad} not a profile link` : ''));
}

  const n = followUpsOf(d).length + 1, s = fuFlow.step;
  const body = s === 0
    ? `<div class="small muted">Screenshot of your follow-up</div>
       <label class="drop" for="f_fushot" data-drop="fu">${fuFlow.shotUrl ? `<img src="${fuFlow.shotUrl}" alt="Follow-up screenshot">` : 'Drag & drop the screenshot here<br>or tap to choose'}<input type="file" id="f_fushot" accept="image/*" hidden></label>
       ${fuFlow.shotUrl ? `<button class="sm" data-act="funoshot" style="justify-self:start">Remove screenshot</button>` : ''}`
    : `<label class="f">Loom transcript (only if you sent a Loom with this follow-up)<textarea id="fu_loom" rows="8" placeholder="Paste the Loom transcript here, or leave empty">${esc(fuFlow.loom)}</textarea></label>`;
  return `<div class="card fu-card" style="display:grid;gap:14px">
    <div class="row" style="justify-content:space-between"><b>Follow-up #${n} · @${esc(d.handle)}</b><span class="small muted">${esc(d.channel || 'Instagram')}</span></div>
    <div class="steps">${['Message','Loom'].map((l,i)=>`<div class="${i===s?'on':i<s?'past':''}">${i+1}. ${l}</div>`).join('')}</div>
    ${body}
    <div class="row" style="justify-content:space-between">
      <button data-act="${s ? 'fuback' : 'fucancel'}">${s ? 'Back' : 'Cancel'}</button>
      <button class="primary" data-act="${s ? 'fusave' : 'funext'}" ${fuFlow.saving ? 'disabled' : ''}>${s ? (fuFlow.saving ? 'Saving…' : 'Save follow-up') : 'Next'}</button>
    </div>
  </div>`;
}

function followUpHistory(){
  const items = [];
  for(const d of dms) followUpsOf(d).forEach((f,i) => items.push({ d, f, n:i+1 }));
  if(!items.length) return `<div class="card empty small">No follow-ups logged yet. Tap <b>Log follow-up</b> on a DM to add one, with or without a Loom.</div>`;
  items.sort((a,b) => b.f.at.localeCompare(a.f.at));
  // A follow-up "worked" if the reply came in after it.
  const worked = x => x.d.status !== 'sent' && x.d.repliedAt && x.d.repliedAt > x.f.at;
  const withLoom = items.filter(x => x.f.loom).length, wins = items.filter(worked).length;
  return `<div class="small muted">${items.length} follow-up${items.length===1?'':'s'} · ${wins} got a reply after (${pct(wins, items.length)}) · ${withLoom} with a Loom</div>
  <div class="card list">${items.map(x => `<div class="fuitem">
      <div class="top">
        <a href="${igUrl(x.d.handle)}" class="ig" style="color:var(--ink);font-weight:600">@${esc(x.d.handle)}</a>
        <span class="small muted">Follow-up #${x.n} · ${new Date(x.f.at).toLocaleDateString(undefined,{month:'short',day:'numeric'})}</span>
        ${x.f.loom ? '<span class="pill fu-soft">Loom</span>' : ''}
        <span style="flex:1"></span>
        <span class="pill ${worked(x) ? 'good' : ''}">${worked(x) ? 'Replied after' : 'No reply yet'}</span>
      </div>
      ${x.f.text ? `<div class="txt">${esc(x.f.text)}</div>` : ''}
      ${x.f.shotId || x.f.loom ? `<details><summary>Screenshot${x.f.loom ? ' & Loom' : ''}</summary>
        ${x.f.shotId ? `<img src="${esc(x.f.shotUrl || '/_blob/'+x.f.shotId)}" alt="Follow-up screenshot" loading="lazy">` : ''}
        ${x.f.loom ? `<pre>${esc(x.f.loom)}</pre>` : ''}
      </details>` : ''}
    </div>`).join('')}</div>`;
}

function setFuShot(file){
  if(!fuFlow || !file || !file.type.startsWith('image/')) return;
  if(fuFlow.shotUrl) URL.revokeObjectURL(fuFlow.shotUrl);
  fuFlow.shot = file; fuFlow.shotUrl = URL.createObjectURL(file);
  renderTrack();
}

async function saveFollowUp(){
  const d = dms.find(x => x.handle === fuFlow.handle); if(!d) return;
  if(!fuFlow.shot && !fuFlow.loom.trim()){ fuFlow.step = 0; renderTrack(); toast('Add the screenshot of your follow-up'); return; }
  fuFlow.saving = true; renderTrack();
  const now = new Date().toISOString(), entry = { at:now, text:'', loom:fuFlow.loom.trim() };
  let reply = null;
  if(fuFlow.shot && assets){ try{ const a = await assets.upload(fuFlow.shot); entry.shotId = a.id; entry.shotUrl = a.url; }catch(e){} }
  if(fuFlow.shot && sample && canImages){
    try{
      const r = await sample.json(`This screenshot shows a ${d.channel || 'Instagram'} conversation where the sender is following up with a prospect.
Transcribe the sender's latest follow-up message(s), word for word. Then check whether the prospect replied after it, and whether they agreed to a call.
Reply with only JSON: {"text": "the follow-up, word for word", "reply": {"replied": true|false, "text": "their reply, word for word", "sentiment": "positive|neutral|negative", "booked": true|false}}`, { modelTier:'quick', images:[fuFlow.shot] });
      entry.text = String(r?.text || '').slice(0,2000);
      reply = readReply(r);
    }catch(e){}
  }
  const list = (d.followUps || (d.followedUpAt ? [{ at:d.followedUpAt, text:'' }] : [])).concat(entry);
  const patch = { followUps:list, followedUpAt:now };
  if(reply && d.status === 'sent') Object.assign(patch, { status: reply.booked ? 'booked' : 'replied', repliedAt:now, reply:{ text:reply.text, sentiment:reply.sentiment } });
  try{
    await store.collection('dms').doc(d.handle).update(patch);
    fuFlow = null; renderTrack(); sparkle($('#track .stats'), 16);
    toast(reply && d.status === 'sent' ? `Follow-up logged · @${d.handle} replied` : `Follow-up #${list.length} logged for @${d.handle}`);
  }catch(e){ fuFlow.saving = false; renderTrack(); toast("Couldn't save. Try again."); }
}

const SUBS = [['pipeline','Pipeline'],['followups','Follow-ups'],['dms','DMs'],['insights','Insights']];
let sub = 'pipeline';

function renderTrack(){
  const el = $('#track');
  const due = dms.filter(d => followState(d)?.k === 'due').sort((a,b) => a.sentAt.localeCompare(b.sentAt));
  $('#fuCount').innerHTML = due.length ? `<span class="count">${due.length}</span>` : '';
  if(tab !== 'track') return;
  if(!store){ el.innerHTML = `<div class="notice">${loaded ? 'Open this page in Claude to see your tracking.' : 'Connecting…'}</div>`; return; }
  if(!dms.length && !leads.length){ el.innerHTML = `<div class="card empty">No DMs yet. Go to Start and log your first one.</div>`; return; }

  const sent = dms.length, replies = dms.filter(responded).length, booked = dms.filter(d => d.status === 'booked').length;
  const late = dms.filter(d => followState(d)?.k === 'late').length;
  const all = dms.slice().sort((a,b) => b.sentAt.localeCompare(a.sentAt));
  const pad = n => String(n).padStart(2,'0');
  const local = iso => { const x = new Date(iso); return `${x.getFullYear()}-${pad(x.getMonth()+1)}-${pad(x.getDate())}T${pad(x.getHours())}:${pad(x.getMinutes())}`; };

  // One row per DM: who, where they stand, the one next step, and everything else under More.
  const row = d => {
    const f = followState(d), h = esc(d.handle), fuN = followUpsOf(d).length;
    const status = d.status === 'booked' ? `<span class="pill solid">Booked${d.bookedFor ? ' · ' + esc(fmtCall(d.bookedFor)) : ''}</span>`
      : d.status === 'replied' ? '<span class="pill good">Responded</span>'
      : d.status === 'lost' ? '<span class="pill bad">Not interested</span>'
      : d.status === 'later' ? `<span class="pill ${f?.k==='due'?'fu':'fu-soft'}">${f ? f.label : 'In 30 days'}</span>`
      : f ? `<span class="pill ${f.k==='due'?'fu':f.k==='late'?'bad':f.k==='wait'?'fu-soft':''}">${f.label}</span>`
      : (d.seen ? '<span class="pill">Seen</span>' : '<span class="pill">Contacted</span>');
    const next = d.status === 'sent' ? `<button class="sm primary" data-act="replied" data-h="${h}">Responded</button>`
      : d.status === 'replied' ? `<button class="sm primary" data-act="bookopen" data-h="${h}">Book call</button>`
      : d.status === 'booked' ? `<button class="sm" data-act="bookopen" data-h="${h}">Change time</button>` : '';
    const moreBtns = [
      d.status !== 'booked' ? `<button class="sm" data-act="fuopen" data-h="${h}">Log follow-up${fuN ? ` (${fuN})` : ''}</button>` : '',
      d.status === 'sent' && canImages ? `<label class="btnlike">Check for reply<input type="file" accept="image/*" data-reply="${h}" hidden></label>` : '',
      ['sent','lost','later'].includes(d.status) ? `<button class="sm" data-act="bookopen" data-h="${h}">Book call</button>` : '',
      d.status !== 'later' && d.status !== 'booked' ? `<button class="sm" data-act="setlater" data-h="${h}">Follow up in 30 days</button>` : '',
      d.status !== 'lost' ? `<button class="sm" data-act="setlost" data-h="${h}">Not interested</button>` : '',
    ].join('');
    const form = booking === d.handle ? `<div class="book"><input type="datetime-local" min="${local(new Date().toISOString()).slice(0,10)}T00:00" value="${d.bookedFor ? local(d.bookedFor) : ''}"><button class="sm primary" data-act="booksave" data-h="${h}">Save</button><button class="sm" data-act="bookcancel">Cancel</button></div>` : '';
    return `<div class="dm"${d.status === 'sent' && canImages ? ` data-drop="${h}"` : ''}>
      <div class="dm-main">
        <div class="who"><a href="${igUrl(d.handle)}" class="ig" title="Open @${h} on Instagram">@${h}</a>
          <div class="small muted">${new Date(d.sentAt).toLocaleDateString(undefined,{month:'short',day:'numeric'})} · ${esc(d.channel || 'Instagram')}${d.followers ? ' · ' + compact(d.followers) + ' followers' : ''}</div>${d.engagement ? `<div style="margin-top:4px">${engPill(d)}</div>` : ''}</div>
        ${status}${next}
      </div>${form}
      <details class="more"><summary>More</summary>
        <div class="row" style="margin-top:8px">${moreBtns}</div>
        ${d.shotId ? `<img src="${esc(d.shotUrl || '/_blob/'+d.shotId)}" alt="Message screenshot" style="margin-top:10px" loading="lazy">` : ''}
        ${d.opener ? `<pre>${esc(d.opener)}</pre>` : ''}
        ${d.reply ? `<div class="small" style="margin-top:6px"><span class="pill ${d.reply.sentiment==='positive'?'good':d.reply.sentiment==='negative'?'bad':''}">Reply · ${esc(d.reply.sentiment)}</span> ${esc(d.reply.text)}</div>` : ''}
        ${d.score?.feedback ? `<div class="small" style="margin:8px 0"><b>Next time:</b> ${esc(d.score.feedback)}</div>` : ''}
        ${d.loom ? `<pre>${esc(d.loom)}</pre>` : ''}
      </details>
    </div>`;
  };

  const sections = {
    pipeline: () => `
      ${pipelineCard()}
      ${upcomingCalls().length ? `<div class="card list">${upcomingCalls().map(d => `<div class="call"><span class="pill solid">Call</span><span class="when">${esc(fmtCall(d.bookedFor))}</span><a href="${igUrl(d.handle)}" class="ig" style="color:var(--ink);font-weight:600">@${esc(d.handle)}</a></div>`).join('')}</div>` : ''}
      <div class="sec-h"><h2>Board</h2><span class="small muted">Drag a card, or use Move to…</span></div>
      ${boardHTML()}`,
    followups: () => `
      <div class="sec-h"><h2 class="fu-h">Due <i>now</i></h2><span class="small muted">${FOLLOW_UP_AFTER}+ days without a reply, and 30-day follow-ups on their date</span></div>
      ${due.length ? `<div class="card list">${due.map(row).join('')}</div>` : `<div class="card empty small">Nothing due. You're on top of it.</div>`}
      <div class="sec-h"><h2>History</h2></div>
      ${followUpHistory()}`,
    dms: () => {
      const shown = stage === 'all' ? all : all.filter(d => d.status === stage);
      return `
      <div class="views">${STAGES.map(([k,l]) => `<button class="${stage===k?'on':''}" data-act="stage" data-s="${k}">${l}<b>${(k==='all' ? all : all.filter(d => d.status===k)).length}</b></button>`).join('')}</div>
      ${shown.length ? `<div class="card list">${shown.map(row).join('')}</div>` : `<div class="card empty small">Nobody here yet.</div>`}`;
    },
    insights: () => `
      <div class="stats">
        <div class="stat"><span>DMs sent</span><b>${sent}</b></div>
        <div class="stat hero"><span>Response rate</span><b>${pct(replies,sent)}</b><small>${replies} replied</small></div>
        <div class="stat"><span>Calls booked</span><b>${booked}</b><small>${pct(booked,sent)} of DMs</small></div>
        <div class="stat"><span>Missed follow-ups</span><b style="${late?'color:var(--bad)':''}">${late}</b></div>
      </div>
      <div class="sec-h"><h2>Opener <i>ranking</i></h2></div>
      ${openerRanking()}
      <div class="sec-h"><h2>What gets <i>replies</i></h2></div>
      ${bucketTable('Channel', group(d => d.channel || 'Instagram', CHANNELS))}
      ${bucketTable('Audience engagement', group(d => d.engagement?.label ?? tier(d.er), ['High','Medium','Low']))}`,
  };

  el.innerHTML = `
  ${fuCardHTML()}
  <div class="subnav" role="tablist">${SUBS.map(([k,l]) => `<button role="tab" aria-selected="${sub===k}" class="${sub===k?'on':''}" data-act="sub" data-s="${k}">${l}${k==='followups' && due.length ? `<span class="count">${due.length}</span>` : ''}</button>`).join('')}</div>
  ${sections[sub]()}`;
}

/* ---------- Events ---------- */
document.addEventListener('click', async e => {
  const t = e.target.closest('[data-tab]');
  if(t){ if(t.dataset.sub) sub = t.dataset.sub; tab = t.dataset.tab; showTab(); if(t.dataset.sub) window.scrollTo({ top:0 }); return; }
  const b = e.target.closest('[data-act]'); if(!b) return;
  switch(b.dataset.act){
    case 'start': {
      // Next DM after one is saved should skip the profile just logged (the snapshot may lag a moment).
      const done = flow?.result?.handle;
      startWith(pendingLeads().find(l => l.handle !== done)?.handle); break;
    }
    case 'stage': stage = b.dataset.s; renderTrack(); break;
    case 'sub': sub = b.dataset.s; renderTrack(); break;
    case 'setlater': { const at = b.getBoundingClientRect(); moveTo('dm', b.dataset.h, 'later').then(ok => { if(ok) sparkle({ getBoundingClientRect:() => at }, 10); renderTrack(); }); break; }
    case 'setlost': { const at = b.getBoundingClientRect(); moveTo('dm', b.dataset.h, 'lost').then(ok => { if(ok) sparkle({ getBoundingClientRect:() => at }, 10); renderTrack(); }); break; }
    case 'copyig': { const u = igUrl(b.dataset.h); toast(await copyText(u) ? 'Link copied. Paste it in a new tab' : u); break; }
    case 'leadadd': addLeads($('#leadPaste')?.value || ''); break;
    case 'leadnext': startWith(pendingLeads()[0]?.handle); break;
    case 'leaddm': startWith(b.dataset.h); break;
    case 'leaddel': try{ await store.collection('leads').doc(b.dataset.h).delete(); toast(`Removed @${b.dataset.h}`); }catch(err){ toast("Couldn't remove. Try again."); } break;
    case 'cancel': flow = null; renderFlow(); break;
    case 'done': flow = null; renderFlow(); break;
    case 'back': readStep(); flow.step--; renderFlow(); break;
    case 'next':
      readStep();
      if(flow.step === 0){
        const h = parseHandle(flow.d.url);
        if(!h){ toast('Paste their Instagram profile link'); return; }
        const ex = dms.find(x => x.handle === h);
        if(ex){ toast(`You already DMed @${h} on ${new Date(ex.sentAt).toLocaleDateString()}`); return; }
      }
      if(flow.step === 1 && !flow.d.shot){ toast('Drop in the screenshot of your message'); return; }
      flow.step++; renderFlow(); break;
    case 'save': save(); break;
    case 'channel': readStep(); flow.d.channel = b.dataset.c; renderFlow(); break;
    case 'noshot': readStep(); URL.revokeObjectURL(flow.d.shotUrl); flow.d.shot = null; flow.d.shotUrl = ''; renderFlow(); break;
    case 'fuopen': fuFlow = { handle:b.dataset.h, step:0, shot:null, shotUrl:'', loom:'', saving:false }; renderTrack(); window.scrollTo({ top:0, behavior:'smooth' }); break;
    case 'fucancel': fuFlow = null; renderTrack(); break;
    case 'fuback': fuFlow.step = 0; renderTrack(); break;
    case 'funext': if(!fuFlow.shot){ toast('Drop in the screenshot of your follow-up'); return; } fuFlow.step = 1; renderTrack(); $('#fu_loom')?.focus(); break;
    case 'funoshot': URL.revokeObjectURL(fuFlow.shotUrl); fuFlow.shot = null; fuFlow.shotUrl = ''; renderTrack(); break;
    case 'fusave': saveFollowUp(); break;
    case 'bookopen': booking = b.dataset.h; renderTrack(); b.closest('.dm')?.querySelector('.book input')?.focus(); break;
    case 'bookcancel': booking = null; renderTrack(); break;
    case 'booksave': {
      const v = b.closest('.book')?.querySelector('input')?.value, h = b.dataset.h, d = dms.find(x => x.handle === h);
      if(!v){ toast('Pick a date and time for the call'); return; }
      const when = new Date(v);
      if(isNaN(when) || when < Date.now() - 3600e3 || when > Date.now() + 365*864e5){ toast('That date looks wrong. Check the year and day.'); return; }
      b.disabled = true;
      try{
        await store.collection('dms').doc(h).update({ status:'booked', bookedFor:when.toISOString(), repliedAt:d?.repliedAt || new Date().toISOString() });
        booking = null; toast(`Call booked with @${h} ✦`); confetti(50);
      }catch(err){ b.disabled = false; toast("Couldn't save. Try again."); }
      break;
    }
    case 'followed': case 'replied': case 'booked': {
      const h = b.dataset.h, now = new Date().toISOString();
      const patch = b.dataset.act === 'followed' ? { followedUpAt:now }
                  : b.dataset.act === 'replied' ? { status:'replied', repliedAt:now }
                  : { status:'booked' };
      b.disabled = true;
      const at = b.getBoundingClientRect(), ghost = { getBoundingClientRect:() => at };
      try{ await store.collection('dms').doc(h).update(patch); sparkle(ghost, 16); toast(b.dataset.act === 'followed' ? 'Follow-up logged' : b.dataset.act === 'replied' ? `@${h} marked as responded` : `Call booked with @${h}`); }
      catch(err){ b.disabled = false; toast("Couldn't save. Try again."); }
      break;
    }
  }
});
document.addEventListener('input', e => {
  if(e.target.id === 'fu_loom' && fuFlow){ fuFlow.loom = e.target.value; return; }
  if(!flow || flow.result) return;
  const id = e.target.id; if(!id.startsWith('f_')) return;
  flow.d[id.slice(2)] = e.target.value;
  if(['f_followers','f_avgLikes','f_avgComments'].includes(id)){
    const er = engagement(flow.d);
    $('#erOut').innerHTML = er==null ? 'Engagement rate appears here.' : `Engagement rate <b>${(er*100).toFixed(1)}%</b> · ${tier(er)}`;
  }
});
document.addEventListener('change', e => {
  if(e.target.id === 'f_shot') setShot(e.target.files[0]);
  else if(e.target.id === 'f_fushot') setFuShot(e.target.files[0]);
  else if(e.target.dataset.reply){ checkReply(e.target.dataset.reply, e.target.files[0]); e.target.value = ''; }
  else if(e.target.dataset.move && e.target.value){
    const [kind, h] = e.target.dataset.move.split(':'), col = e.target.value, at = e.target.getBoundingClientRect();
    moveTo(kind, h, col).then(ok => { if(ok) sparkle({ getBoundingClientRect:() => at }, 14); renderTrack(); });
  }
});
// Board: drag a card onto another column.
let dragCard = null;
document.addEventListener('dragstart', e => {
  const c = e.target.closest?.('[data-card]'); if(!c) return;
  dragCard = c.dataset.card; c.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', dragCard);
});
document.addEventListener('dragend', e => { e.target.closest?.('[data-card]')?.classList.remove('dragging'); document.querySelectorAll('.col.over').forEach(c => c.classList.remove('over')); dragCard = null; });
document.addEventListener('dragover', e => { const col = dragCard && e.target.closest?.('[data-col]'); if(col){ e.preventDefault(); document.querySelectorAll('.col.over').forEach(c => c !== col && c.classList.remove('over')); col.classList.add('over'); } });
document.addEventListener('drop', e => {
  const col = dragCard && e.target.closest?.('[data-col]'); if(!col) return;
  e.preventDefault(); col.classList.remove('over');
  const [kind, h] = dragCard.split(':'); dragCard = null;
  moveTo(kind, h, col.dataset.col).then(ok => { if(ok) sparkle(col, 16); renderTrack(); });
});
// Drag and drop: onto the message step, or onto any sent DM in Tracking to check for a reply.
const dropTarget = e => e.target.closest?.('[data-drop]');
document.addEventListener('dragover', e => { const t = dropTarget(e); if(t){ e.preventDefault(); t.classList.add('over'); } });
document.addEventListener('dragleave', e => { const t = dropTarget(e); if(t && !t.contains(e.relatedTarget)) t.classList.remove('over'); });
document.addEventListener('drop', e => {
  const t = dropTarget(e); if(!t) return;
  e.preventDefault(); t.classList.remove('over');
  const f = [...(e.dataTransfer?.files || [])].find(f => f.type.startsWith('image/'));
  if(!f){ toast('Drop an image file'); return; }
  if(t.dataset.drop === 'flow') setShot(f); else if(t.dataset.drop === 'fu') setFuShot(f); else checkReply(t.dataset.drop, f);
});
document.addEventListener('paste', e => {
  const f = [...(e.clipboardData?.files || [])].find(f => f.type.startsWith('image/'));
  if(!f) return;
  if(tab === 'track' && fuFlow && fuFlow.step === 0){ e.preventDefault(); setFuShot(f); return; }
  if(!flow || flow.result || flow.step !== 1) return;
  e.preventDefault(); setShot(f);
});
document.addEventListener('keydown', e => {
  if(e.key === 'Enter' && e.target.tagName === 'INPUT' && flow && !flow.result){ e.preventDefault(); $('[data-act=next]')?.click(); }
});

function showTab(){
  document.querySelectorAll('[data-tab]').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  $('#start').hidden = tab !== 'start';
  $('#track').hidden = tab !== 'track';
  $('#leads').hidden = tab !== 'leads';
  renderTrack(); renderLeads();
}

/* ---------- Boot ---------- */
showTab(); renderGoal(); renderFlow();
(async () => {
  const c = window.claude;
  [store, sample, assets] = c?.use ? await Promise.all([c.use('db'), c.use('sample'), c.use('assets')]) : [null, null, null];
  if(sample) canImages = !!(await sample.limits().catch(() => null))?.images;
  loaded = true;
  renderFlow(); renderTrack(); renderLeads();
  if(!store) return;
  store.collection('leads').onSnapshot(
    snap => { leads = snap.docs.map(d => d.data()); renderLeads(); renderGoal(); renderTrack(); if(!flow) renderFlow(); },
    () => {}
  );
  store.collection('dms').onSnapshot(
    snap => { dms = snap.docs.map(d => d.data()); renderGoal(); renderTrack(); renderLeads(); if(!flow) renderFlow(); },
    () => toast("Lost connection to your data. Reload the page.")
  );
})();
// Refresh day-based labels (goal, follow-up timers) every 10 minutes.
setInterval(() => { renderGoal(); renderTrack(); }, 6e5);
</script>
</body>
</html>
