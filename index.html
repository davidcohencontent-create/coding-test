<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Outreach CRM</title>
<style>
/* Layout: one narrow column, three tabs, one obvious next action per screen. */
:root{
  --bg:#f7f7f5; --panel:#fff; --ink:#1b1a1f; --muted:#75737d; --line:#e6e5ea; --soft:#f0eff3;
  --accent:#4f46e5; --accent-ink:#fff; --good:#15803d; --bad:#c62828;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#111014; --panel:#1a191e; --ink:#f2f1f5; --muted:#a09ea8; --line:#2b2a31; --soft:#24232a;
    --accent:#8b85ff; --accent-ink:#111014; --good:#4ade80; --bad:#f87171; color-scheme:dark; }
}
:root[data-theme="dark"]{ --bg:#111014; --panel:#1a191e; --ink:#f2f1f5; --muted:#a09ea8; --line:#2b2a31; --soft:#24232a;
  --accent:#8b85ff; --accent-ink:#111014; --good:#4ade80; --bad:#f87171; color-scheme:dark; }
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--line)}
header .in{max-width:760px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
header h1{font-size:15px;margin:0;font-weight:650;flex:1}
nav{display:flex;gap:2px}
nav button{background:none;border:0;padding:6px 12px;border-radius:999px;color:var(--muted);font:inherit;cursor:pointer}
nav button.on{background:var(--soft);color:var(--ink);font-weight:600}
main{max-width:760px;margin:0 auto;padding:20px 16px 60px;display:grid;gap:16px}
main>*{min-width:0}
button,.btn{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:7px 14px;border-radius:8px;cursor:pointer;text-decoration:none;display:inline-block}
button:hover,.btn:hover{border-color:var(--muted)}
button:focus-visible,.btn:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.big{font-size:16px;padding:14px 20px;border-radius:12px;width:100%}
.link{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;font-size:13px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
textarea{resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.muted{color:var(--muted)}
.small{font-size:13px}
.tip a{color:var(--accent)}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:8px 0 -6px;font-weight:600}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat b{display:block;font-size:24px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.stat.hero{border-color:var(--accent)}
.tip{font-size:14px;padding:12px 14px;background:var(--soft);border-radius:10px}
.badge{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.03em;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--muted);vertical-align:middle}
.badge.win{background:var(--good);color:var(--panel)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
td,th{padding:10px 6px;border-bottom:1px solid var(--line);text-align:left}
th{font-size:12px;color:var(--muted);font-weight:500}
tr:last-child td{border-bottom:0}
.num{text-align:right}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);border-radius:999px;padding:4px 12px;background:var(--panel);cursor:pointer;font-size:13px;color:var(--muted)}
.chip.on{border-color:var(--accent);color:var(--ink);font-weight:600}
.list{background:var(--panel);border:1px solid var(--line);border-radius:12px}
.lead{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
.lead:last-child{border-bottom:0}
.lead .who{flex:1;min-width:0}
.lead .who a{color:var(--ink);font-weight:600;text-decoration:none}
.lead .who a:hover{text-decoration:underline}
.lead .who div{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--line)}
.dot.sent{background:var(--accent)} .dot.replied{background:var(--good)} .dot.booked{background:var(--good);box-shadow:0 0 0 3px color-mix(in srgb,var(--good) 30%,transparent)}
.done{font-size:13px;color:var(--good);font-weight:600}
.icon{border:0;background:none;color:var(--muted);padding:6px;font-size:15px}
.msg pre{white-space:pre-wrap;margin:10px 0;font:inherit;font-size:14px;background:var(--soft);padding:10px 12px;border-radius:8px}
.bar{height:6px;background:var(--soft);border-radius:3px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--accent)}
.bar i.win{background:var(--good)}
details summary{cursor:pointer;color:var(--muted);font-size:13px}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--ink);padding:0;width:min(520px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog .hd{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
dialog .hd h3{margin:0;font-size:15px;flex:1;min-width:0}
dialog .bd{padding:18px;display:grid;gap:12px}
dialog .ft{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
#ask{width:min(380px,calc(100vw - 32px))}
label.f{display:grid;gap:4px;font-size:12px;color:var(--muted)}
.empty{text-align:center;padding:32px 16px;color:var(--muted)}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50}
.toast.show{opacity:1}
@media (max-width:560px){ .stats{grid-template-columns:repeat(2,1fr)} header h1{display:none} header .in{justify-content:center} }
@media (prefers-reduced-motion:reduce){ .toast{transition:none} }
</style>
</head>
<body>
<header><div class="in">
  <h1>Outreach CRM</h1>
  <nav id="nav">
    <button data-view="home">Home</button>
    <button data-view="leads">Leads</button>
    <button data-view="messages">Messages</button>
  </nav>
</div></header>
<main id="app"></main>

<dialog id="dlg"></dialog>
<dialog id="ask"></dialog>
<div class="toast" id="toast"></div>

<script>
/* ---------- Data ---------- */
const KEY = 'outreach-crm.v1';
const DAY = 864e5;
// Four steps, in order. Each lead moves forward with one tap.
const STEPS = [
  { k:'new',     label:'To contact', next:'Send' },
  { k:'sent',    label:'Sent',       next:'Got reply' },
  { k:'replied', label:'Replied',    next:'Booked call' },
  { k:'booked',  label:'Booked' },
];
const STEP = Object.fromEntries(STEPS.map((s,i)=>[s.k,{...s,i}]));
const LEGACY = { interested:'replied', not_interested:'replied', won:'booked', ghosted:'sent' };

function blank(){ return { leads:[], messages:[], settings:{ minSample:20 } }; }
function normalize(d){
  d = { ...blank(), ...d, settings:{ ...blank().settings, ...(d && d.settings) } };
  for(const l of d.leads){ if(LEGACY[l.status]) l.status = LEGACY[l.status]; if(!STEP[l.status]) l.status = 'new'; }
  return d;
}
function load(){
  try{ const d = JSON.parse(localStorage.getItem(KEY)); if(d && Array.isArray(d.leads)) return normalize(d); }catch(e){}
  return blank();
}
let db = load();
let ui = { view:'home', filter:'all', q:'' };
try{ ui.view = localStorage.getItem(KEY+'.view') || 'home'; }catch(e){}
if(!['home','leads','messages'].includes(ui.view)) ui.view = 'home';

function persist(){ try{ localStorage.setItem(KEY, JSON.stringify(db)); }catch(e){ toast('Could not save. Download a backup.'); } }
function save(){ persist(); render(); }

/* ---------- Helpers ---------- */
const uid = () => Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4);
const now = () => new Date().toISOString();
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pct = (a,b) => b ? Math.round(1000*a/b)/10 + '%' : '—';
const $ = s => document.querySelector(s);
const msgById = id => db.messages.find(m => m.id === id);
const leadById = id => db.leads.find(l => l.id === id);
const plural = (n,w) => `${n} ${w}${n===1?'':'s'}`;

function toast(t){ const el=$('#toast'); el.textContent=t; el.classList.add('show'); clearTimeout(toast.t); toast.t=setTimeout(()=>el.classList.remove('show'),1800); }
function ago(iso){
  if(!iso) return '';
  const d = (Date.now() - new Date(iso)) / DAY;
  if(d < 1/24) return 'just now';
  if(d < 1) return Math.round(d*24)+'h ago';
  return Math.round(d)+'d ago';
}

// In-page confirm (some viewers block the browser's confirm()).
function ask(msg, ok='Delete'){
  return new Promise(res => {
    const d = $('#ask');
    d.innerHTML = `<div class="bd"><p style="margin:0">${esc(msg)}</p></div><div class="ft"><button value="no">Cancel</button><button value="yes" style="color:var(--bad)">${esc(ok)}</button></div>`;
    d.onclick = e => { const b = e.target.closest('button'); if(b){ d.close(); res(b.value==='yes'); } };
    d.onclose = () => res(false);
    d.showModal();
  });
}

// Accepts "@handle", "instagram.com/handle", or "handle, Name"
function parseHandle(raw){
  raw = (raw || '').trim();
  const m = raw.match(/instagram\.com\/([A-Za-z0-9._]+)/i);
  const h = (m ? m[1] : raw.replace(/^@/,'')).replace(/\/$/,'').toLowerCase();
  return /^[a-z0-9._]{1,30}$/.test(h) && !['p','reel','reels','stories','explore'].includes(h) ? h : null;
}

function fill(body, lead){
  const name = lead.name || lead.handle;
  return body.replaceAll('{name}', name).replaceAll('{first}', name.split(/\s+/)[0]).replaceAll('{handle}', '@'+lead.handle);
}

// Wilson score lower bound (95%): a lucky 2/3 doesn't outrank a solid 12/60.
function wilson(k,n){
  if(!n) return 0;
  const z=1.96, p=k/n;
  return (p + z*z/(2*n) - z*Math.sqrt(p*(1-p)/n + z*z/(4*n*n))) / (1+z*z/n);
}

/* ---------- Stats ---------- */
function totals(){
  const t = { leads:db.leads.length, todo:0, sent:0, replies:0, booked:0 };
  for(const l of db.leads){
    const i = STEP[l.status].i;
    if(i===0) t.todo++;
    if(i>=1) t.sent++;
    if(i>=2) t.replies++;
    if(i>=3) t.booked++;
  }
  return t;
}
function messageStats(){
  const map = Object.fromEntries(db.messages.map(m => [m.id, { m, sent:0, replies:0, booked:0 }]));
  for(const l of db.leads){
    const s = map[l.messageId], i = STEP[l.status].i;
    if(!s || i<1) continue;
    s.sent++; if(i>=2) s.replies++; if(i>=3) s.booked++;
  }
  const list = Object.values(map).map(s => ({ ...s, rate: s.sent ? s.replies/s.sent : 0, score: wilson(s.replies, s.sent) }))
    .sort((a,b) => (!!a.m.archived - !!b.m.archived) || b.score-a.score || b.sent-a.sent);
  const min = db.settings.minSample;
  const best = list.filter(s => s.sent >= min && s.replies > 0).sort((a,b)=>b.score-a.score)[0];
  return { list, winner: best ? best.m.id : null };
}
// Rotate evenly across active messages so each gets a fair test.
function suggestMessage(){
  const active = db.messages.filter(m => !m.archived);
  const count = id => db.leads.filter(l => l.messageId===id && l.status!=='new').length;
  return active.sort((a,b) => count(a.id)-count(b.id))[0] || null;
}

/* ---------- Mutations ---------- */
function setStatus(l, s){
  const t = now(), i = STEP[s].i;
  l.status = s;
  l.sentAt = i>=1 ? (l.sentAt || t) : null;
  l.repliedAt = i>=2 ? (l.repliedAt || t) : null;
  l.updatedAt = t;
}
function addLeads(text){
  const seen = new Set(db.leads.map(l => l.handle));
  let added = 0, dup = 0, bad = 0;
  for(const line of text.split(/\n/)){
    if(!line.trim()) continue;
    const [h, name] = line.split(/\t|,/).map(s => s && s.trim());
    const handle = parseHandle(h);
    if(!handle){ bad++; continue; }
    if(seen.has(handle)){ dup++; continue; }
    seen.add(handle);
    db.leads.push({ id:uid(), handle, name:name||'', status:'new', messageId:null, sentAt:null, repliedAt:null, notes:'', createdAt:now() });
    added++;
  }
  save();
  toast(`Added ${added}` + (dup?` · ${dup} already in list`:'') + (bad?` · ${bad} not recognised`:''));
}

/* ---------- Views ---------- */
function render(){
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('on', b.dataset.view === ui.view));
  $('#app').innerHTML = ({ home:viewHome, leads:viewLeads, messages:viewMessages }[ui.view] || viewHome)();
  if(ui._focusQ){ const q=$('#q'); if(q){ q.focus(); q.setSelectionRange(q.value.length,q.value.length); } ui._focusQ=false; }
}

function nextTip(t, list, winner){
  const min = db.settings.minSample;
  if(!db.messages.length) return `<b>Step 1:</b> write your opening DM in <a href="#" data-view="messages">Messages</a>. Write two different versions if you can, so you can see which one works better.`;
  if(!t.leads) return `<b>Step 2:</b> paste the Instagram profiles you've collected into <a href="#" data-view="leads">Leads</a>.`;
  if(!t.sent) return `<b>Step 3:</b> tap <b>Send next DM</b>. It copies your message and opens their DMs. Paste, send, come back, repeat.`;
  if(winner){
    const w = list.find(s => s.m.id===winner);
    return `<b>${esc(w.m.name)}</b> is your best message: ${pct(w.replies,w.sent)} of people reply. Try to beat it: open <a href="#" data-view="messages">Messages</a> and tap <b>Improve</b>.`;
  }
  const short = list.filter(s => !s.m.archived && s.sent < min);
  if(short.length) return `Keep going. Each message needs ${min} sends before you can tell which one works. ` + short.map(s => `<b>${esc(s.m.name)}</b>: ${min-s.sent} to go`).join(', ') + '.';
  return `No replies yet. Try a different angle: open <a href="#" data-view="messages">Messages</a> and write a new version.`;
}

function viewHome(){
  const t = totals();
  const { list, winner } = messageStats();
  const used = list.filter(s => s.sent);
  return `
  <div class="stats">
    <div class="stat"><span>DMs sent</span><b>${t.sent}</b></div>
    <div class="stat"><span>Replies</span><b>${t.replies}</b></div>
    <div class="stat hero"><span>Response rate</span><b>${pct(t.replies,t.sent)}</b></div>
    <div class="stat"><span>Calls booked</span><b>${t.booked}</b></div>
  </div>

  <button class="primary big" data-action="session">Send next DM${t.todo ? ` <span style="font-weight:400;opacity:.8">· ${t.todo} waiting</span>` : ''}</button>

  <div class="tip">${nextTip(t, list, winner)}</div>

  ${used.length ? `
  <h2>Which message works best</h2>
  <div class="card" style="padding:4px 12px"><table>
    <tr><th>Message</th><th class="num">Sent</th><th class="num">Replies</th><th class="num">Rate</th></tr>
    ${used.map(s => `<tr>
      <td>${esc(s.m.name)} ${s.m.id===winner?'<span class="badge win">BEST</span>':''}${s.m.archived?' <span class="badge">retired</span>':''}</td>
      <td class="num">${s.sent}</td><td class="num">${s.replies}</td><td class="num"><b>${pct(s.replies,s.sent)}</b></td>
    </tr>`).join('')}
  </table></div>` : ''}

  <div class="row" style="justify-content:center;margin-top:8px">
    <button class="link" data-action="settings">Backup &amp; settings</button>
  </div>`;
}

function viewLeads(){
  const counts = { all: db.leads.length };
  for(const s of STEPS) counts[s.k] = 0;
  for(const l of db.leads) counts[l.status]++;
  const q = ui.q.toLowerCase();
  const rows = db.leads.filter(l =>
    (ui.filter==='all' || l.status===ui.filter) &&
    (!q || (l.handle+' '+l.name+' '+l.notes).toLowerCase().includes(q))
  ).slice().reverse();

  return `
  <div class="card" style="display:grid;gap:10px">
    <label class="f" for="bulk" style="font-size:13px">Paste Instagram profiles, one per line (links or @handles)</label>
    <textarea id="bulk" rows="3" placeholder="https://instagram.com/somebody&#10;@another.account"></textarea>
    <div><button class="primary" data-action="add-leads">Add to list</button></div>
  </div>

  ${db.leads.length ? `
  <div class="chips">
    ${[{k:'all',label:'All'},...STEPS].map(s => `<button class="chip ${ui.filter===s.k?'on':''}" data-action="filter" data-f="${s.k}">${s.label} ${counts[s.k]}</button>`).join('')}
  </div>
  ${db.leads.length > 15 ? `<input id="q" placeholder="Search" value="${esc(ui.q)}">` : ''}
  ${rows.length ? `<div class="list">
    ${rows.slice(0,300).map(l => {
      const st = STEP[l.status], m = msgById(l.messageId);
      const meta = [l.name, m && m.name, l.repliedAt ? 'replied '+ago(l.repliedAt) : l.sentAt ? 'sent '+ago(l.sentAt) : ''].filter(Boolean).map(esc).join(' · ');
      return `<div class="lead">
        <span class="dot ${l.status}" title="${st.label}"></span>
        <div class="who"><a href="https://instagram.com/${encodeURIComponent(l.handle)}" target="_blank" rel="noopener">@${esc(l.handle)}</a>${meta?`<div>${meta}</div>`:''}</div>
        ${st.next ? `<button class="${l.status==='new'?'primary':''}" data-action="advance" data-id="${l.id}">${st.next}</button>` : '<span class="done">Booked ✓</span>'}
        <button class="icon" data-action="edit-lead" data-id="${l.id}" aria-label="Edit">✎</button>
      </div>`;}).join('')}
  </div>${rows.length>300?`<div class="muted small">Showing 300 of ${rows.length}. Use search to narrow it down.</div>`:''}`
  : `<div class="empty">Nobody here.</div>`}` : `<div class="empty">Your list is empty. Paste the profiles you've collected above.</div>`}`;
}

function viewMessages(){
  const { list, winner } = messageStats();
  const min = db.settings.minSample;
  const active = list.filter(s => !s.m.archived), retired = list.filter(s => s.m.archived);
  const card = s => `<div class="card msg">
      <div class="row">
        <b style="flex:1;min-width:0">${esc(s.m.name)} ${s.m.id===winner?'<span class="badge win">BEST</span>':''}</b>
        ${s.m.archived ? '' : `<button data-action="iterate" data-id="${s.m.id}">Improve</button>`}
        <button class="icon" data-action="edit-msg" data-id="${s.m.id}" aria-label="Edit">✎</button>
      </div>
      ${s.m.parentId && msgById(s.m.parentId) ? `<div class="muted small">New version of ${esc(msgById(s.m.parentId).name)}${s.m.hypothesis?` · ${esc(s.m.hypothesis)}`:''}</div>` : ''}
      <pre>${esc(s.m.body)}</pre>
      <div class="small muted">${s.sent} sent · ${s.replies} replies · <b style="color:var(--ink)">${pct(s.replies,s.sent)}</b> reply rate${!s.m.archived && s.sent<min ? ` · ${min-s.sent} more sends to know` : ''}</div>
      <div class="bar"><i class="${s.m.id===winner?'win':''}" style="width:${Math.min(100,s.rate*100)}%"></i></div>
    </div>`;
  return `
  <button class="primary" data-action="new-msg" style="justify-self:start">+ New message</button>
  <div class="muted small">Messages you're using take turns, so each gets a fair test. Use <code>{first}</code> to drop in their first name. When one wins, tap <b>Improve</b> to write a new version and change one thing.</div>
  ${active.length ? active.map(card).join('') : `<div class="card empty">No messages yet. Write the DM you'd send to someone on your list.</div>`}
  ${retired.length ? `<details><summary>Retired messages (${retired.length})</summary><div style="display:grid;gap:12px;margin-top:12px;opacity:.75">${retired.map(card).join('')}</div></details>` : ''}`;
}

/* ---------- Dialogs ---------- */
function openDialog(html){ const d=$('#dlg'); d.innerHTML=html; if(!d.open) d.showModal(); return d; }
function closeDialog(){ const d=$('#dlg'); if(d.open) d.close(); }

function msgUsage(id){ return db.leads.filter(l=>l.messageId===id && l.status!=='new').length; }
function nextVersionName(name){
  const m = name.match(/^(.*?)\s*v(\d+)$/);
  const base = m ? m[1] : name;
  let k = m ? +m[2]+1 : 2;
  while(db.messages.some(x => x.name===`${base} v${k}`)) k++;
  return `${base} v${k}`;
}

function msgDialog(m, parent){
  const isNew = !m;
  if(!m) m = parent ? { name:nextVersionName(parent.name), body:parent.body, parentId:parent.id }
                    : { name:`Message ${String.fromCharCode(65 + db.messages.length % 26)}`, body:'' };
  const used = !isNew && msgUsage(m.id);
  const d = openDialog(`
    <div class="hd"><h3>${parent ? 'Improve: '+esc(parent.name) : isNew ? 'New message' : 'Edit message'}</h3><button class="icon" data-action="close" aria-label="Close">✕</button></div>
    <div class="bd">
      <label class="f">Name<input id="mName" value="${esc(m.name)}"></label>
      <label class="f">Message<textarea id="mBody" rows="7" placeholder="Hey {first}, loved your recent reel on…">${esc(m.body)}</textarea></label>
      ${parent ? `<label class="f">What did you change? (optional)<input id="mHyp" placeholder="e.g. shorter, ends with a question"></label>
        <label class="row small"><input type="checkbox" id="mRetire" checked style="width:auto"> Stop using ${esc(parent.name)}</label>` : ''}
      ${used ? `<div class="muted small">Sent ${plural(used,'time')}. For a real rewrite, use <b>Improve</b> instead so the numbers stay honest.</div>` : ''}
    </div>
    <div class="ft">
      ${!isNew ? `<button data-action="del-msg" data-id="${m.id}" style="color:var(--bad);margin-right:auto">Delete</button>
        <button data-action="toggle-arch" data-id="${m.id}">${m.archived ? 'Use again' : 'Retire'}</button>` : ''}
      <button class="primary" data-action="save-msg" data-id="${m.id||''}" data-parent="${m.parentId||''}">Save</button>
    </div>`);
  d.querySelector('#mBody').focus();
}

function leadDialog(l){
  openDialog(`
    <div class="hd"><h3>@${esc(l.handle)}</h3><a class="small muted" href="https://instagram.com/${encodeURIComponent(l.handle)}" target="_blank" rel="noopener">Profile ↗</a><button class="icon" data-action="close" aria-label="Close">✕</button></div>
    <div class="bd">
      <label class="f">Name<input id="lName" value="${esc(l.name)}"></label>
      <div class="row" style="flex-wrap:nowrap">
        <label class="f" style="flex:1;min-width:0">Status<select id="lStatus">${STEPS.map(s=>`<option value="${s.k}" ${s.k===l.status?'selected':''}>${s.label}</option>`).join('')}</select></label>
        <label class="f" style="flex:1;min-width:0">Message sent<select id="lMsg"><option value="">—</option>${db.messages.map(m=>`<option value="${m.id}" ${m.id===l.messageId?'selected':''}>${esc(m.name)}</option>`).join('')}</select></label>
      </div>
      <label class="f">Notes<textarea id="lNotes" rows="4" placeholder="What they said, next step…">${esc(l.notes)}</textarea></label>
    </div>
    <div class="ft">
      <button data-action="del-lead" data-id="${l.id}" style="color:var(--bad);margin-right:auto">Delete</button>
      <button class="primary" data-action="save-lead" data-id="${l.id}">Save</button>
    </div>`);
}

function settingsDialog(){
  openDialog(`
    <div class="hd"><h3>Backup &amp; settings</h3><button class="icon" data-action="close" aria-label="Close">✕</button></div>
    <div class="bd">
      <div class="muted small">Your data is saved in this browser only. Download a backup now and then, and load it to move to another device.</div>
      <div class="row">
        <button data-action="export-json">Download backup</button>
        <button data-action="export-csv">Download leads (CSV)</button>
        <label class="btn">Load backup<input type="file" id="importFile" accept=".json,application/json" hidden></label>
      </div>
      <label class="f">Sends per message before picking the best one<input type="number" min="1" id="minSample" value="${db.settings.minSample}"></label>
    </div>
    <div class="ft"><button data-action="wipe" style="color:var(--bad);margin-right:auto">Delete all data</button><button data-action="close">Done</button></div>`);
}

// Send flow: shows the next message filled in, copy + open DM, mark sent, next.
let session = null;
function sendDialog(leadId){
  const l = leadById(leadId);
  const active = db.messages.filter(m => !m.archived);
  if(!active.length){ closeDialog(); ui.view='messages'; render(); msgDialog(); toast('Write your first message first'); return; }
  const cur = msgById(l.messageId);
  const m = cur && !cur.archived ? cur : suggestMessage();
  const left = db.leads.filter(x => x.status==='new').length;
  const d = openDialog(`
    <div class="hd"><h3>@${esc(l.handle)}</h3><span class="muted small">${left} waiting</span><button class="icon" data-action="close" aria-label="Close">✕</button></div>
    <div class="bd">
      ${active.length > 1 ? `<label class="f">Message<select id="sMsg">${active.map(x=>`<option value="${x.id}" ${x.id===m.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></label>`
                          : `<input type="hidden" id="sMsg" value="${m.id}">`}
      <textarea id="sBody" rows="7">${esc(fill(m.body,l))}</textarea>
      <a class="btn" style="text-align:center" href="https://ig.me/m/${encodeURIComponent(l.handle)}" target="_blank" rel="noopener" data-action="copy-open">1. Copy message &amp; open their DMs ↗</a>
      <button class="primary" data-action="mark-sent" data-id="${l.id}">2. I sent it${session ? ' → next' : ''}</button>
    </div>
    ${session ? `<div class="ft" style="justify-content:space-between"><button class="link" data-action="skip" data-id="${l.id}">Skip this one</button><button class="link" data-action="close">Stop for now</button></div>` : ''}`);
  const sel = d.querySelector('select#sMsg');
  if(sel) sel.onchange = e => { d.querySelector('#sBody').value = fill(msgById(e.target.value).body, l); };
}
function nextInSession(){
  const queue = db.leads.filter(x => x.status==='new' && !session.skipped.has(x.id));
  if(!queue.length){ session=null; closeDialog(); toast('All done for now'); return; }
  sendDialog(queue[0].id);
}

/* ---------- Events ---------- */
document.addEventListener('click', async e => {
  const b = e.target.closest('[data-action],[data-view]');
  if(!b) return;
  if(b.dataset.view){
    e.preventDefault();
    ui.view = b.dataset.view; try{ localStorage.setItem(KEY+'.view', ui.view); }catch(err){}
    closeDialog(); render(); return;
  }
  const id = b.dataset.id;
  switch(b.dataset.action){
    case 'close': closeDialog(); break;
    case 'filter': ui.filter = b.dataset.f; render(); break;
    case 'add-leads': addLeads($('#bulk').value); break;
    case 'settings': settingsDialog(); break;
    case 'advance': {
      const l = leadById(id);
      if(l.status === 'new'){ session = null; sendDialog(id); break; }
      setStatus(l, STEPS[STEP[l.status].i+1].k); save();
      toast(l.status==='replied' ? `@${l.handle} replied` : `Call booked with @${l.handle}`);
      break;
    }
    case 'session':
      if(!db.messages.some(m => !m.archived)){ ui.view='messages'; render(); msgDialog(); toast('Write your first message first'); return; }
      if(!db.leads.some(l => l.status==='new')){ ui.view='leads'; render(); toast('Add some profiles first'); return; }
      session = { skipped:new Set() }; nextInSession(); break;
    case 'skip': session.skipped.add(id); nextInSession(); break;
    case 'copy-open':
      try{ await navigator.clipboard.writeText($('#sBody').value); toast('Copied. Paste it in the DM.'); }
      catch(err){ $('#sBody').select(); toast('Copy the message manually'); }
      break;
    case 'mark-sent': {
      const l = leadById(id);
      l.messageId = $('#sMsg').value; setStatus(l, 'sent'); persist(); render();
      if(session) nextInSession(); else { closeDialog(); toast(`Sent to @${l.handle}`); }
      break;
    }
    case 'new-msg': msgDialog(); break;
    case 'edit-msg': msgDialog(msgById(id)); break;
    case 'iterate': msgDialog(null, msgById(id)); break;
    case 'toggle-arch': { const m = msgById(id); m.archived = !m.archived; closeDialog(); save(); break; }
    case 'save-msg': {
      const name = $('#mName').value.trim(), body = $('#mBody').value.trim();
      if(!name || !body){ toast('Add a name and the message'); return; }
      let m = id && msgById(id);
      if(!m){ m = { id:uid(), parentId:b.dataset.parent||null, archived:false, createdAt:now(), hypothesis:'' }; db.messages.push(m); }
      Object.assign(m, { name, body });
      const hyp = $('#mHyp'); if(hyp) m.hypothesis = hyp.value.trim();
      const r = $('#mRetire'); if(r && r.checked && msgById(m.parentId)) msgById(m.parentId).archived = true;
      closeDialog(); save(); toast('Saved'); break;
    }
    case 'del-msg': {
      const used = msgUsage(id);
      if(!(await ask(used ? `This message was sent ${plural(used,'time')}. Deleting it removes it from your stats. Retiring it keeps them.` : 'Delete this message?'))) return;
      db.messages = db.messages.filter(m => m.id!==id);
      db.leads.forEach(l => { if(l.messageId===id) l.messageId = null; });
      closeDialog(); save(); break;
    }
    case 'edit-lead': leadDialog(leadById(id)); break;
    case 'save-lead': {
      const l = leadById(id);
      l.name = $('#lName').value.trim(); l.notes = $('#lNotes').value; l.messageId = $('#lMsg').value || null;
      if($('#lStatus').value !== l.status) setStatus(l, $('#lStatus').value);
      closeDialog(); save(); break;
    }
    case 'del-lead': if(await ask(`Delete @${leadById(id).handle}?`)){ db.leads = db.leads.filter(l => l.id!==id); closeDialog(); save(); } break;
    case 'export-json': download(`outreach-backup-${new Date().toISOString().slice(0,10)}.json`, JSON.stringify(db,null,2), 'application/json'); break;
    case 'export-csv': {
      const cols = ['handle','name','status','message','sentAt','repliedAt','notes'];
      const q = v => `"${String(v ?? '').replace(/"/g,'""')}"`;
      const lines = [cols.join(',')].concat(db.leads.map(l => cols.map(c => q(c==='message' ? (msgById(l.messageId)?.name || '') : c==='status' ? STEP[l.status].label : l[c])).join(',')));
      download(`leads-${new Date().toISOString().slice(0,10)}.csv`, lines.join('\n'), 'text/csv'); break;
    }
    case 'wipe': if(await ask('Delete every lead and message? Download a backup first if you might need them.', 'Delete everything')){ db = blank(); closeDialog(); save(); } break;
  }
});

document.addEventListener('change', e => {
  const t = e.target;
  if(t.id === 'minSample'){ db.settings.minSample = Math.max(1, parseInt(t.value) || 1); persist(); render(); }
  else if(t.id === 'importFile' && t.files[0]){
    const f = t.files[0]; t.value = '';
    f.text().then(async txt => {
      try{
        const d = JSON.parse(txt);
        if(!Array.isArray(d.leads) || !Array.isArray(d.messages)) throw 0;
        if(await ask(`Replace what's here with ${plural(d.leads.length,'lead')} and ${plural(d.messages.length,'message')} from the backup?`, 'Replace')){
          db = normalize(d); closeDialog(); save(); toast('Backup loaded');
        }
      }catch(err){ toast("That file isn't a backup from this app"); }
    });
  }
});
document.addEventListener('input', e => { if(e.target.id === 'q'){ ui.q = e.target.value; ui._focusQ = true; render(); } });
$('#dlg').addEventListener('close', () => { session = null; });

async function download(name, text, type){
  const dl = window.claude?.use ? await window.claude.use('downloads').catch(() => null) : null;
  if(dl){
    try{ await dl.save({ filename:name, data:new Blob([text], {type}) }); toast('Saved'); }
    catch(err){ if(err?.code !== 'declined') toast("Downloads aren't available here"); }
    return;
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type}));
  a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

// Keep tabs in sync if the app is open twice.
window.addEventListener('storage', e => { if(e.key === KEY){ db = load(); render(); } });

render();
</script>
</body>
</html>
