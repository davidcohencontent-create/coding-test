<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Outreach CRM</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&display=swap">
<style>
/* Layout: two screens in one narrow column. Start = daily goal + 3-step DM log. Tracking = metrics + follow-ups.
   Look: black, monochrome, white as the only accent; colour only for follow-up urgency and wins. */
:root{
  --bg:#000; --panel:#0a0a0a; --ink:#f5f5f5; --muted:#7a7a7a; --line:#1f1f1f; --soft:#161616;
  --accent:#fff; --accent-ink:#000; --good:#4ade80; --warn:#f5b546; --bad:#f26d6d;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 'Inter Tight',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;letter-spacing:-.005em}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
header .in{max-width:720px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
header h1{font-size:15px;margin:0;font-weight:650;flex:1}
nav{display:flex;gap:2px}
nav button{background:none;border:0;padding:6px 14px;border-radius:999px;color:var(--muted);font:inherit;cursor:pointer}
nav button.on{background:var(--ink);color:var(--bg);font-weight:600}
nav .count{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:999px;background:var(--warn);color:#000;font-size:11px;font-weight:700;line-height:18px;text-align:center}
main{max-width:720px;margin:0 auto;padding:20px 16px 60px;display:grid;gap:16px}
main>*,section>*{min-width:0}
section{display:grid;gap:16px}
button{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:8px 14px;border-radius:8px;cursor:pointer}
button:hover{border-color:var(--muted)}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.big{font-size:17px;padding:16px 20px;border-radius:12px;width:100%}
.sm{font-size:12px;padding:4px 10px}
input,textarea{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%}
textarea{resize:vertical}
input:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
label.f{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.muted{color:var(--muted)}
.small{font-size:13px}
h2{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin:6px 0 -8px;font-weight:600}
/* daily goal */
.goal{display:grid;gap:10px}
.goal .n{font-size:34px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.goal .n small{font-size:16px;color:var(--muted);font-weight:500}
.slots{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.slots i{height:10px;border-radius:5px;background:var(--soft)}
.slots i.on{background:var(--accent)}
.slots.done i.on{background:var(--good)}
.slots i{height:6px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center;font-size:11px;color:var(--muted)}
.week b{display:block;margin:0 auto 2px;width:26px;height:26px;line-height:26px;border-radius:50%;background:var(--soft);color:var(--muted);font-size:12px}
.week b.hit{background:var(--ink);color:var(--bg)}
.week b.part{background:#333;color:var(--ink)}
/* stepper */
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;font-size:12px;color:var(--muted)}
.steps div{border-top:3px solid var(--soft);padding-top:6px}
.steps div.on{border-color:var(--accent);color:var(--ink);font-weight:600}
.steps div.past{border-color:var(--accent)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg button{padding:9px 8px}
.seg button.on{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}
.drop{display:grid;place-items:center;min-height:120px;border:1px dashed #3a3a3a;border-radius:10px;color:var(--muted);font-size:13px;cursor:pointer;padding:10px;text-align:center}
.drop:hover{border-color:var(--muted)}
.drop img,.dm img{max-width:100%;max-height:320px;border-radius:8px;display:block}
.er{font-size:13px;padding:8px 10px;background:var(--soft);border-radius:8px}
/* scores & metrics */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat b{display:block;font-size:24px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.stat.hero{border-color:#3a3a3a}
.score{display:flex;gap:16px;align-items:center}
.score .big-n{font-size:44px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--muted);white-space:nowrap}
.pill.good{color:var(--good)} .pill.warn{background:var(--warn);color:#000} .pill.bad{color:var(--bad)} .pill.solid{background:var(--good);color:#000}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
td,th{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left}
th{font-size:12px;color:var(--muted);font-weight:500}
tr:last-child td{border-bottom:0}
.num{text-align:right;white-space:nowrap}
.list{padding:0}
.dm{padding:12px 14px;border-bottom:1px solid var(--line)}
.dm:last-child{border-bottom:0}
.dm .top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dm a{color:var(--ink);font-weight:600;text-decoration:none}
.dm a:hover{text-decoration:underline}
.dm details{margin-top:6px}
.dm summary{cursor:pointer;font-size:12px;color:var(--muted)}
.dm pre{white-space:pre-wrap;font:inherit;font-size:13px;background:var(--soft);padding:8px 10px;border-radius:8px;margin:6px 0 0;max-height:200px;overflow:auto}
.empty{padding:24px 16px;text-align:center;color:var(--muted)}
.notice{font-size:14px;padding:12px 14px;background:var(--soft);border-radius:10px}
.toast{border:1px solid var(--line);position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50;max-width:calc(100vw - 32px)}
.toast.show{opacity:1}
@media (max-width:560px){ .stats{grid-template-columns:repeat(2,1fr)} .grid3{grid-template-columns:1fr 1fr} .grid3 label:first-child{grid-column:1/-1} }
@media (prefers-reduced-motion:reduce){ .toast{transition:none} }
</style>
</head>
<body>
<header><div class="in">
  <h1>Outreach CRM</h1>
  <nav>
    <button data-tab="start">Start</button>
    <button data-tab="track">Tracking<span id="fuCount"></span></button>
  </nav>
</div></header>

<main>
  <section id="start">
    <div class="card goal" id="goal"></div>
    <div id="flow"></div>
  </section>
  <section id="track" hidden></section>
</main>
<div class="toast" id="toast"></div>

<script>
/* Each DM is one document in "dms", keyed by IG handle:
   { handle, url, followers, avgLikes, avgComments, er, opener, loom, sentAt, day,
     status: sent|replied|booked, repliedAt, followedUpAt, score:{overall, opener, loom, style, feedback} } */
const GOAL = 5, FOLLOW_UP_AFTER = 3, TOO_LATE = 7, DAY = 864e5;

let store = null, sample = null, assets = null, canImages = false, dms = [], loaded = false;
const CHANNELS = ['Instagram','WhatsApp','Email'];
let tab = 'start';
let flow = null;          // null = not started; else { step, d:{...}, result }

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pct = (a,b) => b ? Math.round(1000*a/b)/10 + '%' : '—';
const num = v => { const n = parseFloat(String(v ?? '').replace(/[, ]/g,'').replace(/k$/i,'e3').replace(/m$/i,'e6')); return isFinite(n) ? n : null; };
const localDay = (d = new Date()) => d.toLocaleDateString('en-CA');
const daysSince = iso => Math.floor((Date.now() - new Date(iso)) / DAY);
function toast(t){ const el=$('#toast'); el.textContent=t; el.classList.add('show'); clearTimeout(toast.t); toast.t=setTimeout(()=>el.classList.remove('show'),2200); }

function parseHandle(raw){
  raw = (raw || '').trim();
  const m = raw.match(/instagram\.com\/([A-Za-z0-9._]+)/i);
  const h = (m ? m[1] : raw.replace(/^@/,'')).replace(/\/$/,'').toLowerCase();
  return /^[a-z0-9._]{1,30}$/.test(h) && !['p','reel','reels','stories','explore'].includes(h) ? h : null;
}
function engagement(d){
  const f = num(d.followers), l = num(d.avgLikes) || 0, c = num(d.avgComments) || 0;
  if(!f || (!l && !c)) return null;
  return (l + c) / f;
}
function tier(er){
  if(er == null) return null;
  return er >= .03 ? 'High' : er >= .01 ? 'Medium' : 'Low';
}
// Where a DM stands on follow-up: none needed, waiting, due, too late.
function followState(d){
  if(d.status !== 'sent') return null;
  if(d.followedUpAt) return { k:'done', label:'Followed up' };
  const days = daysSince(d.sentAt);
  if(days >= TOO_LATE) return { k:'late', label:'Too late', days };
  if(days >= FOLLOW_UP_AFTER) return { k:'due', label:`Follow up · ${TOO_LATE-days}d left`, days };
  return { k:'wait', label:`Follow up in ${FOLLOW_UP_AFTER-days}d`, days };
}

/* ---------- Start screen ---------- */
function renderGoal(){
  const today = localDay();
  const n = dms.filter(d => d.day === today).length;
  const week = [];
  for(let i=6;i>=0;i--){
    const dt = new Date(Date.now() - i*DAY), k = localDay(dt);
    const c = dms.filter(d => d.day === k).length;
    week.push(`<div><b class="${c>=GOAL?'hit':c?'part':''}">${c}</b>${dt.toLocaleDateString(undefined,{weekday:'narrow'})}</div>`);
  }
  $('#goal').innerHTML = `
    <div class="row" style="justify-content:space-between;align-items:flex-end">
      <div><div class="small muted">Today's DMs</div><div class="n">${n}<small> / ${GOAL}</small></div></div>
      <div class="small ${n>=GOAL?'':'muted'}" style="${n>=GOAL?'color:var(--good);font-weight:600':''}">${n>=GOAL ? 'Goal hit' : `${GOAL-n} to go`}</div>
    </div>
    <div class="slots ${n>=GOAL?'done':''}">${Array.from({length:GOAL},(_,i)=>`<i class="${i<n?'on':''}"></i>`).join('')}</div>
    <div class="week">${week.join('')}</div>`;
}

function renderFlow(){
  const el = $('#flow');
  if(!store){ el.innerHTML = `<div class="notice">${loaded ? 'Open this page in Claude to log DMs.' : 'Connecting…'}</div>`; return; }
  if(!flow){
    el.innerHTML = `<button class="primary big" data-act="start">Start outreach</button>`;
    return;
  }
  if(flow.result) return renderResult();
  const d = flow.d, s = flow.step;
  const labels = ['Account','Message','Loom'];
  let body = '';
  if(s === 0){
    const er = engagement(d), t = tier(er);
    body = `
      <label class="f">Instagram profile link<input id="f_url" value="${esc(d.url)}" placeholder="https://instagram.com/username" autocomplete="off"></label>
      <div class="small muted">Profile engagement (check their last 3 posts)</div>
      <div class="grid3">
        <label class="f">Followers<input id="f_followers" inputmode="decimal" value="${esc(d.followers)}" placeholder="12.4k"></label>
        <label class="f">Avg likes<input id="f_avgLikes" inputmode="decimal" value="${esc(d.avgLikes)}" placeholder="350"></label>
        <label class="f">Avg comments<input id="f_avgComments" inputmode="decimal" value="${esc(d.avgComments)}" placeholder="20"></label>
      </div>
      <div class="er" id="erOut">${er==null ? 'Engagement rate appears here.' : `Engagement rate <b>${(er*100).toFixed(1)}%</b> · ${t}`}</div>`;
  } else if(s === 1){
    body = `
      <div class="small muted">Sent via</div>
      <div class="seg">${CHANNELS.map(c => `<button class="${d.channel===c?'on':''}" data-act="channel" data-c="${c}">${c}</button>`).join('')}</div>
      <div class="small muted">Screenshot of your message</div>
      <label class="drop" for="f_shot">${d.shotUrl ? `<img src="${d.shotUrl}" alt="Message screenshot">` : 'Tap to add a screenshot, or paste one'}<input type="file" id="f_shot" accept="image/*" hidden></label>
      ${d.shotUrl ? `<button class="sm" data-act="noshot" style="justify-self:start">Remove screenshot</button>` : ''}
      <label class="f">Message text ${d.shot ? '(optional, Claude reads the screenshot)' : ''}<textarea id="f_opener" rows="4" placeholder="Hey Sarah, made you a quick video on…">${esc(d.opener)}</textarea></label>`;
  } else {
    body = `<label class="f">Loom transcript<textarea id="f_loom" rows="9" placeholder="Paste the Loom transcript here">${esc(d.loom)}</textarea></label>`;
  }
  el.innerHTML = `<div class="card" style="display:grid;gap:14px">
    <div class="steps">${labels.map((l,i)=>`<div class="${i===s?'on':i<s?'past':''}">${i+1}. ${l}</div>`).join('')}</div>
    ${body}
    <div class="row" style="justify-content:space-between">
      <button data-act="${s ? 'back' : 'cancel'}">${s ? 'Back' : 'Cancel'}</button>
      <button class="primary" data-act="${s<2 ? 'next' : 'save'}" ${flow.saving?'disabled':''}>${s<2 ? 'Next' : flow.saving ? 'Saving…' : 'Save & score'}</button>
    </div>
  </div>`;
  const first = el.querySelector('input,textarea'); if(first) first.focus();
}

function renderResult(){
  const r = flow.result, sc = r.score;
  $('#flow').innerHTML = `<div class="card" style="display:grid;gap:14px">
    <div class="row" style="justify-content:space-between"><b>@${esc(r.handle)} logged</b><span class="pill good">Sent</span></div>
    ${sc ? `<div class="score">
        <div class="big-n">${sc.overall}<span class="small muted">/10</span></div>
        <div class="small" style="display:grid;gap:2px">
          <div>Opener <b>${sc.opener}/10</b> · Loom <b>${sc.loom}/10</b></div>
          <div class="muted">Style: ${esc(sc.style)}</div>
        </div>
      </div>
      <div class="notice">${esc(sc.feedback)}</div>`
    : flow.scoring ? `<div class="notice">Scoring…</div>`
    : `<div class="notice">Saved. Scoring isn't available here right now. Ask Claude in chat to score it.</div>`}
    <button class="primary big" data-act="start">Next DM</button>
    <button data-act="done" style="justify-self:center;border:0;background:none;color:var(--muted)">Done for now</button>
  </div>`;
}

function readStep(){
  const d = flow.d;
  for(const k of ['url','followers','avgLikes','avgComments','opener','loom']){
    const i = $('#f_'+k); if(i) d[k] = i.value;
  }
}

function setShot(file){
  if(!flow || flow.result || !file || !file.type.startsWith('image/')) return;
  readStep();
  if(flow.d.shotUrl) URL.revokeObjectURL(flow.d.shotUrl);
  flow.d.shot = file; flow.d.shotUrl = URL.createObjectURL(file);
  renderFlow();
}

async function scoreDM(doc, shot){
  if(!sample) return null;
  const useShot = shot && canImages;
  const prompt = `You score cold outreach sent via ${doc.channel}. The sender messages a short opener and a personalised Loom video.
Score how likely this gets a reply, given the prospect's profile engagement.

Prospect: @${doc.handle}. Followers: ${doc.followers ?? 'unknown'}. Avg likes: ${doc.avgLikes ?? 'unknown'}. Avg comments: ${doc.avgComments ?? 'unknown'}. Engagement rate: ${doc.er != null ? (doc.er*100).toFixed(2)+'%' : 'unknown'}.

Opener message:
${useShot ? 'It is in the attached screenshot. Read it from there.' + (doc.opener ? ' The sender also typed: """' + doc.opener + '"""' : '') : '"""' + doc.opener + '"""'}

Loom transcript:
"""${(doc.loom || '').slice(0, 12000)}"""

Reply with only JSON: {"openerText": "the opener message, transcribed word for word", "opener": 1-10, "loom": 1-10, "overall": 1-10, "style": "2-4 word label for the opener's approach", "feedback": "one specific sentence on what to change next time"}`;
  const r = await sample.json(prompt, useShot ? { modelTier:'default', images:[shot] } : { modelTier:'default' });
  const clamp = v => Math.max(1, Math.min(10, Math.round(+v || 0))) || null;
  if(!r || !clamp(r.overall)) return null;
  return { openerText:String(r.openerText || '').slice(0,4000), overall:clamp(r.overall), opener:clamp(r.opener), loom:clamp(r.loom), style:String(r.style || 'Unlabelled').slice(0,40), feedback:String(r.feedback || '').slice(0,300) };
}

async function save(){
  readStep();
  const d = flow.d, handle = parseHandle(d.url);
  if(!handle){ flow.step = 0; renderFlow(); toast('Add a valid Instagram profile link'); return; }
  if(!d.opener.trim() && !d.shot){ flow.step = 1; renderFlow(); toast('Add a screenshot or the message text'); return; }
  const existing = dms.find(x => x.handle === handle);
  if(existing){ toast(`@${handle} is already logged (${new Date(existing.sentAt).toLocaleDateString()})`); return; }
  const er = engagement(d);
  const doc = {
    handle, url:`https://instagram.com/${handle}`,
    followers:num(d.followers), avgLikes:num(d.avgLikes), avgComments:num(d.avgComments), er,
    channel:d.channel || 'Instagram', opener:d.opener.trim(), loom:d.loom.trim(),
    sentAt:new Date().toISOString(), day:localDay(), status:'sent'
  };
  flow.saving = true; renderFlow();
  const shot = d.shot;
  if(shot && assets){
    try{ const a = await assets.upload(shot); doc.shotId = a.id; doc.shotUrl = a.url; }
    catch(e){ toast("Screenshot couldn't be stored. Saving the rest."); }
  }
  try{ await store.collection('dms').doc(handle).set(doc); }
  catch(e){ flow.saving = false; renderFlow(); toast("Couldn't save. Check your connection and try again."); return; }
  try{ localStorage.removeItem('outreach-draft'); }catch(e){}
  flow = { result:{ handle }, scoring:!!sample };
  renderResult();
  if(!sample) return;
  try{
    const score = await scoreDM(doc, shot);
    if(score){
      const { openerText, ...rest } = score;
      await store.collection('dms').doc(handle).update(doc.opener || !openerText ? { score:rest } : { score:rest, opener:openerText });
    }
    if(flow && flow.result && flow.result.handle === handle){ flow.result.score = score; flow.scoring = false; renderResult(); }
  }catch(e){
    if(flow && flow.result && flow.result.handle === handle){ flow.scoring = false; renderResult(); }
  }
}

/* ---------- Tracking screen ---------- */
function bucketTable(title, rows){
  rows = rows.filter(r => r.sent);
  if(!rows.length) return '';
  const best = rows.filter(r => r.sent >= 5).sort((a,b) => b.replies/b.sent - a.replies/a.sent)[0];
  return `<div class="card list" style="overflow-x:auto"><table>
    <tr><th>${title}</th><th class="num">Sent</th><th class="num">Replies</th><th class="num">Rate</th></tr>
    ${rows.map(r => `<tr><td>${esc(r.label)} ${best && r===best && r.replies ? '<span class="pill solid">BEST</span>' : ''}</td><td class="num">${r.sent}</td><td class="num">${r.replies}</td><td class="num"><b>${pct(r.replies,r.sent)}</b></td></tr>`).join('')}
  </table></div>`;
}
function group(keyFn, order){
  const g = {};
  for(const d of dms){
    const k = keyFn(d); if(k == null) continue;
    const r = g[k] ||= { label:k, sent:0, replies:0 };
    r.sent++; if(d.status !== 'sent') r.replies++;
  }
  const rows = Object.values(g);
  return order ? order.map(k => g[k]).filter(Boolean) : rows.sort((a,b) => b.sent - a.sent);
}

function renderTrack(){
  const el = $('#track');
  const due = dms.filter(d => followState(d)?.k === 'due').sort((a,b) => a.sentAt.localeCompare(b.sentAt));
  $('#fuCount').innerHTML = due.length ? `<span class="count">${due.length}</span>` : '';
  if(tab !== 'track') return;
  if(!store){ el.innerHTML = `<div class="notice">${loaded ? 'Open this page in Claude to see your tracking.' : 'Connecting…'}</div>`; return; }
  if(!dms.length){ el.innerHTML = `<div class="card empty">No DMs yet. Go to Start and log your first one.</div>`; return; }

  const sent = dms.length, replies = dms.filter(d => d.status !== 'sent').length, booked = dms.filter(d => d.status === 'booked').length;
  const scored = dms.filter(d => d.score?.overall);
  const avg = scored.length ? (scored.reduce((s,d) => s + d.score.overall, 0) / scored.length).toFixed(1) : '—';
  const late = dms.filter(d => followState(d)?.k === 'late').length;
  const all = dms.slice().sort((a,b) => b.sentAt.localeCompare(a.sentAt));

  const row = d => {
    const f = followState(d), sc = d.score?.overall;
    const status = d.status === 'booked' ? '<span class="pill solid">Booked</span>' : d.status === 'replied' ? '<span class="pill good">Replied</span>' : '';
    const fu = f ? `<span class="pill ${f.k==='due'?'warn':f.k==='late'?'bad':''}">${f.label}</span>` : '';
    const btns = d.status === 'sent'
      ? `${f && (f.k==='due' || f.k==='wait') ? `<button class="sm" data-act="followed" data-h="${esc(d.handle)}">Followed up</button>` : ''}<button class="sm" data-act="replied" data-h="${esc(d.handle)}">Replied</button>`
      : d.status === 'replied' ? `<button class="sm" data-act="booked" data-h="${esc(d.handle)}">Booked call</button>` : '';
    return `<div class="dm">
      <div class="top">
        <a href="${esc(d.url)}" target="_blank" rel="noopener">@${esc(d.handle)}</a>
        <span class="small muted">${new Date(d.sentAt).toLocaleDateString(undefined,{month:'short',day:'numeric'})}${d.channel ? ' · '+esc(d.channel) : ''}${tier(d.er) ? ' · '+tier(d.er)+' eng.' : ''}${sc ? ` · score ${sc}/10` : ''}</span>
        <span style="flex:1"></span>${status}${fu}
      </div>
      <div class="row" style="margin-top:8px">${btns}</div>
      <details><summary>Message, Loom & feedback</summary>
        ${d.shotId ? `<img src="${esc(d.shotUrl || '/_blob/'+d.shotId)}" alt="Message screenshot" style="margin-top:6px" loading="lazy">` : ''}
        ${d.opener ? `<pre>${esc(d.opener)}</pre>` : ''}
        ${d.score?.feedback ? `<div class="small" style="margin-top:6px"><b>${esc(d.score.style)}</b> · ${esc(d.score.feedback)}</div>` : ''}
        ${d.loom ? `<pre>${esc(d.loom)}</pre>` : ''}
      </details>
    </div>`;
  };

  el.innerHTML = `
  <div class="stats">
    <div class="stat"><span>DMs sent</span><b>${sent}</b></div>
    <div class="stat"><span>Replies</span><b>${replies}</b></div>
    <div class="stat hero"><span>Response rate</span><b>${pct(replies,sent)}</b></div>
    <div class="stat"><span>Calls booked</span><b>${booked}</b></div>
    <div class="stat"><span>Avg score</span><b>${avg}</b></div>
    <div class="stat"><span>Missed follow-ups</span><b style="${late?'color:var(--bad)':''}">${late}</b></div>
  </div>

  <h2>Follow up now</h2>
  ${due.length ? `<div class="card list">${due.map(row).join('')}</div>`
    : `<div class="card empty small">Nothing due. DMs show up here ${FOLLOW_UP_AFTER} days after sending without a reply. After ${TOO_LATE} days it's too late.</div>`}

  <h2>What gets replies</h2>
  ${bucketTable('Opener style', group(d => d.score?.style))}
  ${bucketTable('Score', group(d => { const s = d.score?.overall; return s == null ? null : s >= 8 ? '8–10' : s >= 5 ? '5–7' : '1–4'; }, ['8–10','5–7','1–4']))}
  ${bucketTable('Channel', group(d => d.channel || 'Instagram', CHANNELS))}
  ${bucketTable('Profile engagement', group(d => tier(d.er), ['High','Medium','Low']))}

  <h2>All DMs</h2>
  <div class="card list">${all.map(row).join('')}</div>`;
}

/* ---------- Events ---------- */
document.addEventListener('click', async e => {
  const t = e.target.closest('[data-tab]');
  if(t){ tab = t.dataset.tab; showTab(); return; }
  const b = e.target.closest('[data-act]'); if(!b) return;
  switch(b.dataset.act){
    case 'start': {
      const lastCh = dms.slice().sort((a,b) => b.sentAt.localeCompare(a.sentAt))[0]?.channel;
      let d = { url:'', followers:'', avgLikes:'', avgComments:'', opener:'', loom:'', channel: lastCh || 'Instagram', shot:null, shotUrl:'' };
      flow = { step:0, d }; renderFlow(); break;
    }
    case 'cancel': flow = null; renderFlow(); break;
    case 'done': flow = null; renderFlow(); break;
    case 'back': readStep(); flow.step--; renderFlow(); break;
    case 'next':
      readStep();
      if(flow.step === 0){
        const h = parseHandle(flow.d.url);
        if(!h){ toast('Paste their Instagram profile link'); return; }
        const ex = dms.find(x => x.handle === h);
        if(ex){ toast(`You already DMed @${h} on ${new Date(ex.sentAt).toLocaleDateString()}`); return; }
      }
      if(flow.step === 1 && !flow.d.opener.trim() && !flow.d.shot){ toast('Add a screenshot or the message text'); return; }
      flow.step++; renderFlow(); break;
    case 'save': save(); break;
    case 'channel': readStep(); flow.d.channel = b.dataset.c; renderFlow(); break;
    case 'noshot': readStep(); URL.revokeObjectURL(flow.d.shotUrl); flow.d.shot = null; flow.d.shotUrl = ''; renderFlow(); break;
    case 'followed': case 'replied': case 'booked': {
      const h = b.dataset.h, now = new Date().toISOString();
      const patch = b.dataset.act === 'followed' ? { followedUpAt:now }
                  : b.dataset.act === 'replied' ? { status:'replied', repliedAt:now }
                  : { status:'booked' };
      b.disabled = true;
      try{ await store.collection('dms').doc(h).update(patch); toast(b.dataset.act === 'followed' ? 'Follow-up logged' : b.dataset.act === 'replied' ? `@${h} replied` : `Call booked with @${h}`); }
      catch(err){ b.disabled = false; toast("Couldn't save. Try again."); }
      break;
    }
  }
});
document.addEventListener('input', e => {
  if(!flow || flow.result) return;
  const id = e.target.id; if(!id.startsWith('f_')) return;
  flow.d[id.slice(2)] = e.target.value;
  if(['f_followers','f_avgLikes','f_avgComments'].includes(id)){
    const er = engagement(flow.d);
    $('#erOut').innerHTML = er==null ? 'Engagement rate appears here.' : `Engagement rate <b>${(er*100).toFixed(1)}%</b> · ${tier(er)}`;
  }
});
document.addEventListener('change', e => { if(e.target.id === 'f_shot') setShot(e.target.files[0]); });
document.addEventListener('paste', e => {
  if(!flow || flow.result || flow.step !== 1) return;
  const f = [...(e.clipboardData?.files || [])].find(f => f.type.startsWith('image/'));
  if(f){ e.preventDefault(); setShot(f); }
});
document.addEventListener('keydown', e => {
  if(e.key === 'Enter' && e.target.tagName === 'INPUT' && flow && !flow.result){ e.preventDefault(); $('[data-act=next]')?.click(); }
});

function showTab(){
  document.querySelectorAll('[data-tab]').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  $('#start').hidden = tab !== 'start';
  $('#track').hidden = tab !== 'track';
  renderTrack();
}

/* ---------- Boot ---------- */
showTab(); renderGoal(); renderFlow();
(async () => {
  const c = window.claude;
  [store, sample, assets] = c?.use ? await Promise.all([c.use('db'), c.use('sample'), c.use('assets')]) : [null, null, null];
  if(sample) canImages = !!(await sample.limits().catch(() => null))?.images;
  loaded = true;
  renderFlow(); renderTrack();
  if(!store) return;
  store.collection('dms').onSnapshot(
    snap => { dms = snap.docs.map(d => d.data()); renderGoal(); renderTrack(); },
    () => toast("Lost connection to your data. Reload the page.")
  );
})();
// Refresh day-based labels (goal, follow-up timers) every 10 minutes.
setInterval(() => { renderGoal(); renderTrack(); }, 6e5);
</script>
</body>
